<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Narracut · 候选审阅原型</title>
<style>
:root{font:14px/1.55 system-ui,"Noto Sans CJK SC",sans-serif;color:#171717;background:white;color-scheme:light;--line:#e7e7e7;--muted:#626262}*{box-sizing:border-box}body{margin:0}button,select,input,textarea{font:inherit;color:inherit}button{border:1px solid var(--line);border-radius:7px;background:white;padding:6px 12px;min-height:34px;cursor:pointer}button:hover{background:#f2f2f2}button:disabled{color:#777;background:#eee;cursor:default}button.primary{background:#202020;color:white;border-color:#202020}button.flat{border-color:transparent}button.active{background:#ededed;font-weight:600}button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid #075fc2;outline-offset:2px}::selection{background:#d9eaff}*{scrollbar-color:#bbb #f7f7f7}header{height:62px;padding:0 26px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}header strong{font-size:16px;font-weight:600}small,.muted{font-size:12px;color:var(--muted)}header span{margin-left:14px;color:var(--muted)}nav{height:49px;display:flex;align-items:center;gap:16px;padding:0 26px;border-bottom:1px solid var(--line)}nav button{height:49px;border:0;border-radius:0;background:none}nav button.active{border-bottom:2px solid #202020;background:none}nav small{margin-left:auto}.main{height:calc(100dvh - 216px);min-height:360px;padding:16px 26px 12px;display:flex;flex-direction:column;gap:10px}.topline,.controls,.decision,.row{display:flex;align-items:center;gap:10px}.topline{min-height:34px}.topline h1{font-size:17px;font-weight:600;margin:0 auto 0 0}.topline small{margin-right:8px}.stage{flex:1;min-height:0;display:flex;gap:20px;position:relative}.view{flex:1;min-width:0;display:flex;flex-direction:column}.screen{flex:1;min-height:0;background:#f5f5f5;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:6px}canvas{width:100%;height:100%;object-fit:contain}.controls{padding-top:9px;font-variant-numeric:tabular-nums}.controls input{flex:1;min-width:70px;accent-color:#333}.controls span{font-size:12px}.decision{border-top:1px solid var(--line);padding-top:10px;min-height:50px}.decision .summary{flex:1;min-width:0}.summary strong{font-weight:500}.summary small{display:block}.notice{color:#873c0b;background:#fff4e8;padding:8px 12px;border-radius:5px;display:flex;gap:15px;align-items:center}.notice button{margin-left:auto;white-space:nowrap}.side{width:290px;flex-shrink:0;overflow:auto;border-left:1px solid var(--line);padding:4px 0 0 20px}.side h2,.sheet h2{font-size:17px;margin:0 0 16px}.side h3,.sheet h3{font-size:14px;margin:20px 0 8px}.side p,.sheet p{margin:8px 0;line-height:1.7}.side .primary{width:100%;margin-top:15px}.side .tabs{flex-wrap:wrap}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding-bottom:8px}.tabs button{padding:5px 9px;border-color:transparent}.sheet{position:absolute;right:0;top:0;bottom:0;width:min(420px,90%);background:white;box-shadow:-8px 0 30px #0002;padding:22px;overflow:auto;z-index:2}.sheet .close{float:right}.sheet.bottom{top:auto;left:0;width:100%;max-height:65%;border-radius:8px 8px 0 0;box-shadow:0 -8px 25px #0002}.sheet.bottom .body{max-width:780px}.proof{display:flex;gap:8px;flex-wrap:wrap}.proof button{background:#f6f6f6}details{margin:16px 0}summary{cursor:pointer}.switcher{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:min(910px,calc(100% - 24px));background:#222;color:white;padding:10px 14px;border-radius:12px;box-shadow:0 5px 20px #0002;z-index:5}.switcher .row{flex-wrap:wrap}.switcher button,.switcher select{background:#343434;color:white;border:1px solid #666;border-radius:6px;min-height:32px}.switcher button.active{background:white;color:#171717}.switcher select{padding:4px;margin-left:auto;max-width:210px}.switcher p{font-size:12px;margin:6px 0 0;color:#ddd}.switcher details{margin:3px 0 0;font-size:12px}.switcher pre{white-space:pre-wrap;max-height:100px;overflow:auto}.scene{max-width:900px;margin:20px auto;width:100%}.scene textarea{width:100%;height:90px;padding:12px;border:1px solid #ccc;border-radius:6px;caret-color:#075fc2}.scene h1{font-size:20px}.scene .row{border-bottom:1px solid #eee;padding:14px 0}.scene .row p{flex:1}dialog{border:0;border-radius:12px;box-shadow:0 18px 65px #0003;padding:26px;width:min(480px,90vw)}dialog::backdrop{background:#0004}dialog h2{font-size:19px;margin-top:0}dialog footer{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}.blank{display:grid;place-items:center;height:100%;text-align:center}.blank p{color:var(--muted)}[hidden]{display:none!important}@media(max-width:1000px){.main{padding-left:16px;padding-right:16px}.side{width:245px;padding-left:14px}.stage{gap:14px}.decision .summary{font-size:13px}.topline small{display:none}}@media(max-width:720px){.side{width:210px}.main{padding:10px;min-height:380px}.decision{flex-wrap:wrap}.decision .summary{flex-basis:100%}header,nav{padding:0 12px}nav small{display:none}.switcher p{display:none}}
</style>
<header><div><strong>雨后散步</strong><span>Narracut</span></div><small>候选审阅 · 可丢弃原型</small></header><nav><button id="table">表格工作区</button><button id="agent" class="active">Agent 工作区</button><small>合成项目 · 不写入真实数据</small></nav><main id="main" class="main"></main>
<div class="switcher"><div class="row"><button id="prev" aria-label="上一个方案">←</button><button data-v="A">A 视频＋审阅抽屉</button><button data-v="B">B 视频＋精简侧栏</button><button data-v="C">C 视频＋底部审阅</button><button id="next" aria-label="下一个方案">→</button><select id="scenario" aria-label="模拟场景"><option value="ready">候选可接受</option><option value="stale">输入已变化</option><option value="blocked">检查阻断</option><option value="warning">有非阻断警告</option><option value="running">任务运行中</option><option value="draft">缺少 Speech</option><option value="empty">尚无候选</option></select></div><p id="desc"></p><details><summary>模拟条件与当前状态</summary><p>2026-09-12 · 动画为合成画面，播放、检查、接受和输出均为内存模拟；不代表真实 Codex 外层验收。</p><pre id="state"></pre></details></div><dialog id="dialog"></dialog>
<script>
// 可丢弃 UI 原型：固定浅色视觉与视频优先，比较三种辅助信息结构。没有后端或真实文件写入。
const $=s=>document.querySelector(s);const names={A:'视频占满工作面，需要时打开审阅抽屉；观看时辅助信息最少。',B:'视频为主，右侧只保留摘要和当前操作；审阅信息持续可见。',C:'视频占满工作面，底部按需展开审阅；信息跟随观看顺序。'};
let variant=new URLSearchParams(location.search).get('variant')||'A';if(!names[variant])variant='A';
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); let narration='';
let state,clock=3,playing=false,drawer=false,tab='summary',workspace='agent',saved=false,job=0;
function reset(mode='ready'){narration='积水映着经过的人，也映着远处还没散去的云。';job++;state={mode,candidate:mode!=='empty',view:mode==='empty'?'current':'candidate',task:mode==='running'?'运行中':mode==='empty'?'无任务':'等待用户',accepted:false,render:'未输出',warning:mode==='warning',stale:mode==='stale',blocked:mode==='blocked',draft:mode==='draft'};drawer=false;tab='summary';workspace='agent';clock=3;playing=false;saved=false;render()}
function canOutput(){return state.accepted&&!state.stale&&!state.blocked&&!state.draft}
function canAccept(){return state.candidate&&!state.stale&&!state.blocked&&state.task!=='运行中'}
function facts(){ $('#state').textContent=JSON.stringify({方案:variant,视口:`${innerWidth}×${innerHeight}`,工作区:workspace,审阅页:drawer?tab:'收起',播放:playing,秒:Math.floor(clock),...state},null,2)}
function button(action,label,cls='',disabled=false){return `<button data-action="${action}" class="${cls}" ${disabled?'disabled':''}>${label}</button>`}
function content(){if(tab==='summary')return '<h3>这次调整了什么</h3><p>让散步的节奏更舒缓。片头缩短，旁白文字改为两行，Scene 衔接更柔和。</p><h3>创作目标</h3><p>保留雨后街道的安静感，让文字更好读。</p><details><summary>查看完整创作指令</summary><p>开场直接进入街景，旁白文字不要挡住画面主体，整体保持轻松舒缓。</p></details>';
if(tab==='checks')return `<h3>${state.stale?'检查证据已过期':state.blocked?'有一项阻断':'检查通过'}</h3><p>${state.stale?'Scene 内容已变化，当前画面与证据不再对应最新输入。请在当前 Codex 对话中要求更新候选。':state.blocked?'最新候选构建失败。正在展示上一份成功画面，它已过期，不能据此接受。请在当前 Codex 对话中要求修复。':'程序、时间窗和执行环境检查通过。'}</p>${state.draft?'<p>Scene 3 尚无 Speech。可以接受草稿表现，但最终输出前需生成 Speech 并重新验收。</p>':''}<h3>代表帧</h3><p class="muted">合成检查点；点击定位视频，不代表真实验收证据。</p><div class="proof">${[0,3,7,11].map((s,i)=>button('seek'+s,['片头','Scene 2','衔接','片尾'][i])).join('')}</div><details><summary>查看完整检查与版本身份</summary><p>程序：候选 c7 · 输入：i4 · Preview：p7<br>以上标识均为模拟值。代表帧检查不替代你的视觉判断。</p></details>`;
return '<h3>Scene 3 · 文字可以更简短</h3><p>建议把旁白改为：</p><p>积水映着行人，也映着未散的云。</p><p class="muted">缩短句子能让阅读更从容。由你在表格工作区修改，建议不会自动应用。</p>'+button('copy','复制建议')+' '+button('locate','前往 Scene 3');}
function panel(){return `<div class="tabs">${[['summary','变更摘要'],['checks','检查证据'],['suggestions','Scene 建议 · 1']].map(([v,t])=>button('tab-'+v,t,tab===v?'active':'')).join('')}</div><div class="body">${content()}</div>`}
function warning(){return state.warning?'<div class="notice">片尾文字显示较短，可能来不及读完。此警告不阻断接受。</div>':''}
function acceptActions(){return state.accepted?button('output',state.render==='输出中'?'正在输出…':state.render==='已完成'?'查看输出结果':'输出视频','primary',state.render==='输出中'||!canOutput()):state.candidate?(variant==='B'?'':button('review','审阅详情'))+button('accept','接受候选','primary',!canAccept()):''}
function render(){ $('#table').classList.toggle('active',workspace==='table');$('#agent').classList.toggle('active',workspace==='agent');
if(workspace==='table'){$('#main').innerHTML=`<section class="scene"><div class="row"><h1>脚本 · Scene 3</h1>${button('return','返回候选审阅')}</div><p class="muted">候选与播放位置保留；内容修改后旧证据会过期。</p><label for="narration">Narration</label><textarea id="narration">${esc(narration)}</textarea><p id="saveState" role="status">离开编辑框保存 · 仅模拟此 Scene</p><div class="row"><p>Speech</p><span>${saved?'待生成 · Narration 已变化':'已生成 · 4.2 秒'}</span></div></section>`;$('#narration').addEventListener('input',()=>{narration=$('#narration').value;saved=true;state.stale=true;$('#saveState').textContent='已保存（模拟）· Speech 待生成，候选证据已过期';facts()});finish();return}
let notice=state.stale?(state.accepted?'内容已变化 · 当前画面已过期，需重新验收候选后才能输出。':'内容已变化 · 当前画面已过期，更新候选后才能接受。'):state.blocked?'最新候选构建失败 · 正在看上一份成功画面，不能接受。':state.draft?'草稿预览 · Scene 3 缺少 Speech，可接受候选，暂不能最终输出。':'';
$('#main').innerHTML=`<div class="topline"><h1>${state.accepted?'当前版本':state.view==='candidate'?'候选预览':'当前版本预览'}</h1><small>${state.task==='运行中'?'正在创作 · 画面保留至你切换':state.accepted?'候选已接受 · 任务已终结':state.task==='已停止'?'任务已停止 · 候选已保留':state.candidate?'等待你审阅':'在当前 Codex 对话中开始创作'}</small>${state.candidate?button('compare',state.view==='candidate'?'对比当前':'返回候选'):''}${state.task==='运行中'?button('stop','停止任务'):''}</div>${notice?`<div class="notice">${notice}${button('explain','查看原因')}</div>`:''}${warning()}<div class="stage"><section class="view"><div class="screen"><canvas id="canvas" width="1280" height="720" aria-label="合成视频预览：雨后散步"></canvas></div><div class="controls">${button('play',playing?'暂停':'播放')}<span id="time">00:03 / 00:12</span><input id="seek" aria-label="播放位置" type="range" min="0" max="12" step="0.1" value="${clock}"><span>${state.view==='candidate'?'候选':'当前'}</span></div></section>${variant==='B'?`<aside class="side"><h2>${state.accepted?'准备输出':state.candidate?'候选审阅':'当前版本'}</h2>${state.candidate?panel():state.accepted?'<p>已接受的调整：片头更简洁、文字更清晰、衔接更舒缓。</p><p>本次任务已终结。可从底部输出视频。</p>':'<p>尚无候选可审阅。请在当前 Codex 对话中提出创作要求。</p>'}${state.candidate?'<p>'+button('discard','放弃候选','flat')+'</p>':''}</aside>`:''}${drawer&&variant!=='B'?`<section class="sheet ${variant==='C'?'bottom':''}" aria-label="审阅详情">${button('close','收起','close')}<h2>候选审阅</h2>${panel()}${state.candidate?'<hr>'+button('discard','放弃候选','flat'):''}</section>`:''}</div><div class="decision"><div class="summary"><strong>${state.accepted?(state.render==='已完成'?'视频已输出':state.render==='输出中'?'正在生成视频文件':'候选已成为当前版本'):state.candidate?'片头更简洁，文字更清晰，衔接更舒缓。':'当前版本可继续预览'}</strong><small>${state.accepted?(state.draft?'先在表格生成 Speech，再重新验收候选后输出。':'接受与输出分开进行；输出使用已接受版本。'):state.candidate?'需要修改时，直接在当前 Codex 对话中告诉 Agent。':'创作入口在当前 Codex 对话。'}</small></div>${acceptActions()}</div>`;
$('#seek').addEventListener('input',e=>{clock=+e.target.value;draw();facts()});finish();draw()}
function finish(){document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('active',b.dataset.v===variant));$('#desc').textContent=names[variant];facts()}
function modal(kind){playing=false;let accepted=kind==='accept';$('#dialog').innerHTML=`<h2>${accepted?'接受整个候选？':'放弃候选并终结任务？'}</h2><p>${accepted?'候选将成为当前版本，本次创作任务终结。之后可以单独输出视频。':'本次候选及其恢复检查点会被删除。当前已接受版本保持不变。'}</p>${accepted&&state.warning?'<p>同时接受已展示的警告：片尾文字显示较短。</p>':''}${accepted&&state.draft?'<p>当前是缺少 Speech 的草稿，接受后仍不能最终输出。</p>':''}<footer>${button('cancel','取消')}${button(accepted?'confirmAccept':'confirmDiscard',accepted?'接受整个候选':'放弃候选并终结任务','primary')}</footer>`;$('#dialog').showModal();$('#dialog [data-action="cancel"]').focus()}
function act(a){if(a.startsWith('tab-')){tab=a.slice(4);drawer=true;render();return}if(a.startsWith('seek')){clock=+a.slice(4);playing=false;drawer=false;render();return}switch(a){case'play':playing=!playing;if(clock>=12)clock=0;render();break;case'compare':playing=false;state.view=state.view==='current'?'candidate':'current';clock=3;render();break;case'review':playing=false;drawer=!drawer;render();break;case'close':drawer=false;render();break;case'explain':drawer=true;tab='checks';render();break;case'stop':state.task='已停止';render();break;case'accept':if(canAccept())modal('accept');break;case'discard':modal('discard');break;case'cancel':$('#dialog').close();break;case'confirmAccept':if(!canAccept())return;$('#dialog').close();state.accepted=true;state.candidate=false;state.view='current';state.task='已终结';drawer=false;render();break;case'confirmDiscard':$('#dialog').close();state.candidate=false;state.view='current';state.task='已终结';state.stale=state.blocked=state.warning=false;drawer=false;render();break;case'locate':playing=false;workspace='table';render();break;case'return':workspace='agent';drawer=true;tab='suggestions';render();break;case'copy':navigator.clipboard.writeText('积水映着行人，也映着未散的云。').then(()=>{let b=document.querySelector('[data-action="copy"]');if(b)b.textContent='已复制'}).catch(()=>{let b=document.querySelector('[data-action="copy"]');if(b)b.textContent='请选择上方文字复制'});break;case'output':if(!canOutput())return;if(state.render==='已完成'){$('#dialog').innerHTML='<h2>输出完成（模拟）</h2><p>雨后散步.mp4 · 12 秒 · 1920 × 1080</p><p>原型没有生成真实视频文件。</p><footer>'+button('cancel','关闭')+'</footer>';$('#dialog').showModal();break}state.render='输出中';render();let stamp=++job;setTimeout(()=>{if(stamp!==job)return;state.render='已完成';render()},1400);break}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b&&!b.disabled)act(b.dataset.action);let v=e.target.closest('[data-v]');if(v)setVariant(v.dataset.v)});function setVariant(v){variant=v;drawer=false;let u=new URL(location);u.searchParams.set('variant',v);history.replaceState(null,'',u);render()}function cycle(d){setVariant(['A','B','C'][(['A','B','C'].indexOf(variant)+d+3)%3])}$('#prev').onclick=()=>cycle(-1);$('#next').onclick=()=>cycle(1);document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,button,[contenteditable]')||$('#dialog').open)return;if(e.key==='ArrowLeft'){e.preventDefault();cycle(-1)}if(e.key==='ArrowRight'){e.preventDefault();cycle(1)}});$('#scenario').onchange=e=>reset(e.target.value);$('#table').onclick=()=>{playing=false;workspace='table';render()};$('#agent').onclick=()=>{workspace='agent';render()};
function draw(){let c=$('#canvas');if(!c)return;let x=c.getContext('2d'),candidate=state.view==='candidate'||state.accepted;x.fillStyle=candidate?'#e8e5df':'#d9e2e7';x.fillRect(0,0,1280,720);x.fillStyle='#b8c5bd';x.fillRect(0,430,1280,290);x.fillStyle='#91a99a';for(let i=0;i<7;i++){let bx=i*240-100+(clock*7%240);x.fillRect(bx,150,110,300);x.fillStyle='#c9d3cb';x.fillRect(bx+12,174,85,210);x.fillStyle='#91a99a'}x.fillStyle='#71887c';x.fillRect(0,475,1280,8);x.fillStyle='#f6f4ef';x.fillRect(0,535,1280,185);x.fillStyle='#263e32';x.font=(candidate?'42':'32')+'px system-ui';x.textAlign='center';let lines=['雨停以后，街道慢慢亮了起来。','巷口的咖啡店刚刚开门。','积水映着行人，也映着未散的云。','我们沿着河边走，不急着到达哪里。'];x.fillText(lines[Math.min(3,Math.floor(clock/3))],640,615);x.font='20px system-ui';x.fillStyle='#52685a';x.fillText('雨后散步',640,663);x.textAlign='left';x.font='18px system-ui';x.fillText('合成动态画面 · 无真实音轨',28,40);let sec=Math.floor(clock);$('#time').textContent=`00:${String(sec).padStart(2,'0')} / 00:12`;$('#seek').value=clock}
let last=performance.now();function tick(now){if(playing&&workspace==='agent'&&!$('#dialog').open){clock=Math.min(12,clock+(now-last)/1000);draw();if(clock>=12){playing=false;render()}}last=now;requestAnimationFrame(tick)}reset();requestAnimationFrame(tick);
</script></html>
