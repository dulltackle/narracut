<style>
:root{font:14px/1.6 system-ui,"Noto Sans CJK SC",sans-serif;color:#171717;background:#fff;color-scheme:light;--line:#e7e7e7;--muted:#626262}*{box-sizing:border-box;scrollbar-color:#bbb #fafafa}body{margin:0}button,input,textarea,select{font:inherit;color:inherit}button{background:white;border:1px solid var(--line);border-radius:7px;padding:6px 12px;min-height:34px;cursor:pointer}button:hover{background:#f1f1f1}button:disabled{color:#747474;background:#f0f0f0;cursor:default}button.primary{background:#202020;color:white;border-color:#202020}.flat{border-color:transparent}.active{background:#ededed;font-weight:600}:focus-visible{outline:2px solid #075fc2;outline-offset:2px}::selection{background:#d9eaff}input,textarea,select{border:1px solid #c9c9c9;border-radius:6px;padding:9px;caret-color:#075fc2}textarea{resize:vertical;width:100%;min-height:170px}h1{font-size:23px;font-weight:600;margin:0 0 12px}h2{font-size:18px;font-weight:600;margin:0}h3{font-size:14px;margin:24px 0 8px}p{max-width:70ch}small,.muted{color:var(--muted);font-size:12px}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}header{height:62px;padding:0 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}header strong{font-size:16px;font-weight:600}header small:last-child{margin-left:auto}nav{height:49px;display:flex;align-items:center;padding:0 24px;border-bottom:1px solid var(--line);gap:8px}nav .tab{height:49px;border:0;border-radius:0;background:none}nav .tab.active{border-bottom:2px solid #202020}nav .check{margin-left:auto}.table-scroll{height:calc(100dvh - 290px);min-height:240px;overflow:auto;padding:0 24px}.toolbar{padding:14px 24px}.table{border-collapse:collapse;width:100%;table-layout:fixed}.table th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:10px 12px;background:#fafafa;position:sticky;top:0;z-index:1}.table td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}.table tr.selected{background:#f5f5f5}.table textarea{min-height:42px;height:64px;resize:vertical;border-color:transparent;background:transparent;padding:4px;width:100%}.table textarea:focus{background:white;border-color:#aaa}.table th:nth-child(1){width:64px}.table th:nth-child(3){width:180px}.table th:nth-child(4){width:200px}.empty{padding:65px 24px;text-align:center}.empty p{margin:8px auto 24px}.empty button{margin:0 5px}.launcher{max-width:650px;padding:64px 28px;margin:auto}.launcher .row{margin-top:28px}.launcher label{display:block;margin:20px 0}.launcher input{width:100%}.launcher .path{overflow-wrap:anywhere;font-size:12px;color:var(--muted)}.panel{position:fixed;top:111px;bottom:116px;right:0;width:min(470px,100vw);background:white;box-shadow:-10px 0 32px #0002;z-index:4;overflow:auto;padding:22px}.panel.wide{width:min(690px,100vw)}.panel label{display:block;margin:20px 0}.panel label input,.panel label select{width:100%;margin-top:7px}.panel footer{display:flex;gap:8px;margin-top:24px;align-items:center}.panel .item{padding:18px 0;border-bottom:1px solid var(--line)}.notice{padding:12px 14px;background:#fff4e8;color:#803c13;border-radius:6px;margin:16px 0}.menu{position:absolute;top:53px;left:24px;width:240px;padding:7px;background:white;box-shadow:0 8px 28px #0002;z-index:6;border-radius:9px}.menu button{display:block;width:100%;text-align:left;border:0}.menu hr{border:0;border-top:1px solid var(--line);margin:6px}.statusline{padding:10px 24px;font-size:12px;color:var(--muted)}.prototype{position:fixed;bottom:0;left:0;right:0;padding:10px 20px;background:#252525;color:#fff;z-index:9;height:112px;overflow:auto}.prototype button{background:#363636;color:#fff;border-color:#676767;padding:4px 9px;min-height:30px}.prototype button.active{background:#fff;color:#171717}.prototype p{font-size:12px;margin:5px 0;max-width:none;color:#e0e0e0}.prototype .facts{color:#ddd;font-size:12px}dialog{border:0;border-radius:12px;padding:26px;width:min(490px,90vw);box-shadow:0 18px 60px #0003}dialog::backdrop{background:#0004}dialog footer{display:flex;gap:8px;justify-content:flex-end;margin-top:24px}.blocker{position:fixed;inset:0 0 112px;background:white;z-index:7;overflow:auto;padding:55px max(24px,calc((100vw - 680px)/2))}.blocker h1{font-size:23px}.agent{padding:32px 24px}.agent .screen{height:200px;background:#f5f5f5;display:grid;place-items:center;margin:20px 0;max-width:760px}.badge{color:#803c13;font-size:12px} [hidden]{display:none!important}@media(max-width:1000px){header,nav{padding:0 16px}.table-scroll{padding:0 16px}.table th:nth-child(3){width:140px}.table th:nth-child(4){width:165px}.toolbar{padding:14px 16px}}@media(max-width:700px){header small{display:none}.table th:nth-child(3){width:100px}.table th:nth-child(4){width:120px}.table td{padding:8px 5px}.table th:nth-child(1){width:45px}.panel{top:111px}.prototype{height:130px}.panel{bottom:130px}.table-scroll{height:calc(100dvh - 310px)}nav{gap:0}nav button{padding:6px 8px}}
/* 本轮反馈：单行导航、居中项目信息、紧凑 Speech 控件。 */
header{height:48px;padding:0 16px;gap:16px}header strong{font-size:14px}header #projectMenu{max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}header nav{flex:1;min-width:0;height:48px;padding:0;border:0;gap:4px}nav .tab{height:48px;font-size:13px;padding:0 10px}nav .check{font-size:13px;min-height:30px;padding:4px 9px}header .badge{max-width:110px;font-size:11px}.menu{top:43px;left:16px}.toolbar{padding:10px 16px}.table-scroll{height:calc(100dvh - 221px);padding:0 16px}.table td:last-child{font-size:13px}.table td:last-child .muted{font-size:13px;display:block;margin:2px 0 5px}.table td:last-child button{font-size:13px;line-height:1.4;min-height:28px;padding:4px 8px}.table td:last-child br{display:none}
dialog.panel{position:fixed;inset:0 0 112px;margin:auto;width:min(600px,calc(100vw - 48px));height:fit-content;max-height:calc(100dvh - 152px);padding:24px;border:0;border-radius:12px;box-shadow:0 18px 60px #0003;overflow:auto}dialog.panel.wide{width:min(690px,calc(100vw - 48px))}dialog.panel::backdrop{background:#0003}dialog.panel>.row:first-child{position:sticky;top:-24px;background:white;padding:8px 0;z-index:1}.panel footer{justify-content:flex-end}.panel .item{padding:12px 0}.panel .item p{margin:8px 0}
@media(max-width:700px){header{gap:5px;padding:0 8px}header #projectMenu{max-width:125px}nav .tab{padding:0 6px}header .badge{display:none}dialog.panel{bottom:130px;max-height:calc(100dvh - 162px);width:calc(100vw - 24px);padding:18px}.table-scroll{height:calc(100dvh - 239px)}}
/* 用户反馈：直接可见的项目入口与紧凑同行操作。 */
header{gap:12px}header #projectMenu{max-width:110px}.project-actions{display:flex;align-items:center;gap:2px;margin-left:auto;white-space:nowrap}.project-actions button{font-size:13px;min-height:30px;padding:4px 7px}nav .check{margin-left:6px;white-space:nowrap}nav .tab{white-space:nowrap;flex-shrink:0}.table th:nth-child(4){width:224px}.table td{vertical-align:middle;padding:6px 12px}.table textarea{height:34px;min-height:34px;resize:none;display:block;overflow:hidden;line-height:24px}.speech-inline{display:flex;align-items:center;justify-content:space-between;gap:8px;white-space:nowrap}.table td:last-child .muted{margin:0}.table td:last-child button{flex-shrink:0}.recovery-field{padding:10px 0;border-bottom:1px solid var(--line)}.recovery-field .row{justify-content:space-between}.recovery-field p{margin:4px 0;font-size:12px;color:var(--muted);overflow-wrap:anywhere}.recovery-field button{white-space:nowrap;font-size:13px}#briefBadge{display:none!important}@media(max-width:800px){header{overflow-x:auto}header nav{min-width:675px}header #projectMenu{min-width:75px}.table th:nth-child(4){width:210px}}
button.primary:disabled{background:#ededed;border-color:#ddd;color:#747474}
/* 功能分组与相邻 Speech 操作。 */
header #projectMenu{padding-right:14px;border-right:1px solid #d6d6d6}.workspace-tabs{display:flex;gap:2px;padding:3px;background:#f0f0f0;border-radius:7px}.workspace-tabs .tab{height:30px;border-radius:5px;padding:0 10px}.workspace-tabs .tab.active{background:white;border:0;box-shadow:0 1px 3px #0002}.project-actions{padding-left:12px;border-left:1px solid #d6d6d6}.project-actions [data-action="switch"]{margin-left:7px;border-left:1px solid #d6d6d6;border-radius:0;padding-left:12px}nav .check{margin-left:8px}.speech-inline{justify-content:flex-start;gap:6px}.table th:nth-child(4){width:205px}.source-confirm{display:flex!important;gap:8px;align-items:flex-start;margin:10px 0!important;font-size:13px}.source-confirm input{width:auto!important;margin:4px 0 0!important} .recovery-summary{background:#f7f7f7;padding:12px 14px;border-radius:7px;margin-top:14px}.recovery-summary p{margin:5px 0;overflow-wrap:anywhere}.recovery-summary .row{justify-content:space-between}.recovery-summary button{font-size:12px;padding:3px 8px;min-height:28px}
.recovery-panel>p{margin:8px 0}.recovery-panel .recovery-summary{margin-top:10px;padding:8px 12px}.recovery-panel .recovery-summary p{margin:3px 0;font-size:13px}.recovery-panel .recovery-summary .muted{font-size:12px}.recovery-panel footer{margin-top:14px}.recovery-panel .source-confirm{margin:6px 0!important}
.project-actions{gap:5px}.project-actions button{border:1px solid #d8d8d8;border-radius:6px;background:#fff;padding:4px 8px}.project-actions button:hover{background:#ececec;border-color:#aaa}nav .check{margin-left:0}.project-exit{border-left:1px solid #d6d6d6;margin-left:8px;padding-left:12px}.project-exit button{font-size:13px;white-space:nowrap;min-height:30px;padding:4px 8px;border-color:transparent;color:#755145;background:#faf3f0}.project-exit button:hover{background:#f3e6df;border-color:#d9b8a7}.speech-inline button{width:28px;height:28px;padding:5px!important;display:inline-flex;align-items:center;justify-content:center}.speech-inline svg{width:16px;height:16px}.table th:nth-child(4){width:166px}.recovery-panel .recovery-summary{background:none;border-radius:0;padding:10px 0;border-bottom:1px solid var(--line)}
.panel-close{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;min-height:32px;padding:6px;flex-shrink:0}
</style>
<header><span id="projectMenu"><strong id="projectName">Narracut</strong></span><small id="briefBadge" class="badge" hidden>创作说明待复核</small><nav id="nav" hidden><div class="workspace-tabs" aria-label="工作区切换"><button class="tab active" data-work="table">表格工作区</button><button class="tab" data-work="agent">Agent 工作区</button></div><div class="project-actions" role="group" aria-label="项目操作"><button class="flat" data-action="brief">创作说明</button><button class="flat" data-action="tts">声音配置</button><button class="flat" data-action="history" title="Render Program 历史">程序历史</button><button class="check" data-action="checks" id="checkButton">项目检查</button></div><div class="project-exit"><button data-action="switch" title="关闭项目，返回项目入口">关闭项目</button></div></nav></header>
<div id="menu" hidden></div>
<main id="launcher" class="launcher"></main>
<main id="workbench" hidden><div id="tableView"><div class="toolbar row between"><span id="sceneCount">Scene 内容</span><button data-action="add">添加 Scene</button></div><div class="table-scroll" id="scroll"><div id="empty" class="empty"><h1>从第一句旁白开始</h1><p class="muted">先写内容。生成 Speech 时，再选择整部视频的声音。</p><button class="primary" data-action="add">写第一句旁白</button></div><table id="table" class="table" hidden><thead><tr><th>Scene</th><th>Narration · 旁白</th><th>Asset</th><th>Speech</th></tr></thead><tbody id="rows"></tbody></table></div></div><div id="agentView" class="agent" hidden><h1>Agent 工作区</h1><p id="candidateText"></p><div class="screen">当前视频区域 · 导航占位，不模拟候选审阅</div><p class="muted">在当前 Codex 对话中提出创作要求。候选检查、审阅与接受沿用已确认的审阅原型。</p></div><div id="message" class="statusline" role="status"></div></main>
<dialog id="panel" class="panel" hidden aria-label="项目信息"></dialog><section id="blocker" class="blocker" hidden></section><dialog id="dialog"></dialog>
<div class="prototype"><div class="row wrap"><strong>导航原型 · 试用场景</strong><button data-scenario="new">首次创建</button><button data-scenario="existing">已有项目</button><button data-scenario="long">长项目返回</button><button data-scenario="lost">项目身份失效</button><button data-scenario="recover">从快照恢复</button></div><p id="guide"></p><div class="facts" id="facts"></div></div>
<script>
// 可丢弃导航状态原型：检验按需入口、首次配置和返回上下文。所有数据仅存于内存，不连接生产服务。
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const speechIcon=(ready)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ready?'<path d="M20 7v5h-5M4 17v-5h5M6.1 7a7 7 0 0 1 11.8-1L20 9M4 15l2.1 3A7 7 0 0 0 17.9 17"/>':'<rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11v1a7 7 0 0 0 14 0v-1M12 19v3M9 22h6"/>'}</svg>`;
const button=(a,t,p=false,disabled=false)=>`<button data-action="${a}" class="${p?'primary':''}" ${disabled?'disabled':''}>${t}</button>`;
let s,opener=null,pendingSpeech=null,formVoice='自然叙述（示例）',newName='',parentPicked=false,recoveryStage=0,recoveryFiles={snapshot:false,source:false,target:false};
function reset(mode='new'){s={project:!['new','recover'].includes(mode),name:'雨后散步',work:'table',panel:'',selected:mode==='long'?18:1,brief:'介绍雨后的街道，整体安静，文字简洁。',briefDirty:false,review:false,voice:['new','recover'].includes(mode)?null:'自然叙述（示例）',scenes:[],candidate:false,lost:mode==='lost',exported:false,message:'所有更改仅在本页模拟。',mode};if(s.project)s.scenes=Array.from({length:mode==='long'?30:6},(_,i)=>({text:['雨停以后，街道慢慢亮了起来。','巷口的咖啡店刚刚开门。','积水映着行人，也映着未散的云。'][i%3],speech:true}));s.panel='';pendingSpeech=null;parentPicked=false;recoveryStage=0;recoveryFiles={snapshot:false,source:false,target:false};if($('#panel').open)$('#panel').close();$('#panel').hidden=true;$('#menu').hidden=true;if($('#dialog').open)$('#dialog').close();render();$('#scroll').scrollTop=0;if(mode==='recover')openPanel('recover');if(mode==='long')$('#scroll').scrollTop=1100}
function facts(){let count=s.scenes.filter(x=>x.speech).length;$('#facts').textContent=`模拟状态：${s.project?s.name:'尚未打开项目'} · ${s.project?(s.work==='table'?'表格':'Agent'):'项目入口'} · 所选 Scene ${s.project&&s.scenes.length?s.selected:'无'} · ${({brief:'创作说明',tts:'声音配置',checks:'项目检查',history:'程序历史',recover:'项目恢复'})[s.panel]||'无面板'} · 声音${s.voice?'已配置':'未配置'} · Speech ${count}/${s.scenes.length} · ${s.briefDirty?'创作说明未保存':s.review?'创作说明待复核':'创作说明无新修改'} · ${s.candidate?'已有候选':'无候选'}`;$('#guide').textContent=({new:'创建空项目 → 写一句旁白 → 生成 Speech → 配置声音并返回。',existing:'从顶部入口修改创作说明或声音，查看历史；关闭面板后检查原 Scene 是否保留。',long:'当前选择 Scene 18。滚动后打开项目信息，关闭面板，检查选择与滚动位置。',lost:'异常强制显示恢复路径；导出未保存编辑后返回项目入口。',recover:'选择快照与匹配来源 → 查看恢复计划 → 确认在新路径恢复。'})[s.mode];document.querySelectorAll('[data-scenario]').forEach(b=>b.classList.toggle('active',b.dataset.scenario===s.mode))}
function render(){ $('#projectName').textContent=s.project?s.name:'Narracut';$('#projectMenu').disabled=!s.project||s.lost;$('#nav').hidden=!s.project;$('#launcher').hidden=s.project;$('#workbench').hidden=!s.project;$('#briefBadge').hidden=!s.review||!s.project;if(!s.project)launcher();else{drawRows();setWork(s.work);$('#message').textContent=s.message}drawLost();facts()}
function launcher(){ $('#launcher').innerHTML='<h1>开始一个视频项目</h1><p class="muted">项目保存在本地文件夹中。</p><div class="row wrap">'+button('createForm','创建项目',true)+button('pickOpen','打开项目文件夹')+'</div><p>'+button('recover','从恢复快照创建项目')+'</p>'}
function drawRows(){ $('#rows').innerHTML=s.scenes.map((x,i)=>`<tr class="${s.selected===i+1?'selected':''}"><td><button class="flat" data-select="${i+1}" aria-label="选择 Scene ${i+1}">${String(i+1).padStart(2,'0')}</button></td><td><textarea aria-label="Scene ${i+1} 旁白" data-text="${i}">${esc(x.text)}</textarea></td><td><span class="muted">未绑定 Asset</span></td><td><div class="speech-inline"><span class="muted">${x.speech?'已生成 · 3.2 秒':'未生成'}</span><button data-speech="${i}" aria-label="Scene ${i+1} ${x.speech?'重新生成 Speech':'生成 Speech'}" title="${x.speech?'重新生成 Speech':'生成 Speech'}" ${!x.text.trim()?'disabled':''}>${speechIcon(x.speech)}</button></div></td></tr>`).join('');$('#table').hidden=!s.scenes.length;document.querySelectorAll('[data-text]').forEach(autoSize);$('#empty').hidden=!!s.scenes.length;$('#sceneCount').textContent=`${s.scenes.length} 个 Scene`;$('#checkButton').textContent=`项目检查${s.scenes.some(x=>!x.speech)?' · '+s.scenes.filter(x=>!x.speech).length:''}`}
function setWork(w){s.work=w;$('#tableView').hidden=w!=='table';$('#agentView').hidden=w!=='agent';document.querySelectorAll('[data-work]').forEach(b=>b.classList.toggle('active',b.dataset.work===w));$('#candidateText').textContent=s.candidate?'已从历史修订创建候选；当前修订保持不变，请在当前对话中要求重新检查。':'当前没有候选。';facts()}
function shell(title,content,wide=false){$('#panel').hidden=false;$('#panel').classList.toggle('wide',wide);$('#panel').classList.toggle('recovery-panel',s.panel==='recover');$('#panel').innerHTML=`<div class="row between"><h2 tabindex="-1">${title}</h2><button data-action="close" class="panel-close" aria-label="关闭弹窗" title="关闭"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>${content}`;if(!$('#panel').open)$('#panel').showModal();$('#panel h2').focus()}
function openPanel(which){opener=document.activeElement;$('#menu').hidden=true;$('#projectMenu').setAttribute('aria-expanded','false');s.panel=which;if(which==='brief'){shell('创作说明',`<p class="muted">Video Brief · 整部视频的创作目标、风格和重点。</p><label for="brief">创作说明内容</label><textarea id="brief">${esc(s.brief)}</textarea><p id="briefStatus" role="status">${s.review?'已保存 · 待复核':'已保存'}</p><p class="muted">离开编辑框时保存。关闭后回到原来的工作区。</p>`,true)}if(which==='tts'){formVoice=s.voice||'自然叙述（示例）';shell('整部视频的声音',`<p class="muted">所有 Scene 使用同一套 TTS 配置。</p>${pendingSpeech!==null?'<p>先选声音，再生成刚才那一句的 Speech。</p>':''}<label>声音<select id="voice"><option>自然叙述（示例）</option><option>明亮讲解（示例）</option></select></label><p class="muted">原型仅比较入口。示例声音不对应真实供应商，不收集密钥。</p>${s.scenes.some(x=>x.speech)?'<div class="notice">修改声音配置后，已有 Speech 将失效，需要重新生成。</div>':''}<footer>${button('close','取消')}${button('saveVoice',pendingSpeech!==null?'保存并生成 Speech':'保存声音配置',true)}</footer>`);$('#voice').value=formVoice}if(which==='checks'){shell('项目检查',s.scenes.length?`<p>${s.scenes.filter(x=>!x.speech).length} 个 Scene 尚未生成 Speech。</p>${s.scenes.map((x,i)=>!x.speech?`<div class="item"><p>Scene ${i+1} · 缺少 Speech</p><button data-locate="${i+1}">前往 Scene ${i+1}</button></div>`:'').join('')}${s.scenes.every(x=>x.speech)?'<p>Scene 内容检查通过（模拟）。</p>':''}<h3>Render Program 检查</h3><p>在 Agent 工作区查看候选的检查与审阅证据。</p>${button('gotoAgent','前往 Agent 工作区')}`:'<p>项目还没有 Scene。</p>'+button('addFromCheck','写第一句旁白',true))}if(which==='history'){shell('Render Program 历史',`<p class="muted">已接受的程序修订。回退会创建新候选，仍需重新检查和接受。</p>${s.candidate?'<div class="notice">项目已有候选。请先审阅并接受或放弃它，再从历史创建候选。</div>':''}<div class="item"><strong>当前修订</strong><p>简化片头，调整文字位置。</p><small>今天 10:30 · 合成记录</small></div><div class="item"><strong>上一个修订</strong><p>保留长片头，文字居中。</p><small>昨天 16:10 · 合成记录</small><p>${button('rollback','从此修订创建候选',false,s.candidate)}</p></div><div class="item"><strong>更早的修订 · 内容损坏</strong><p class="muted">无法比较或回退。当前项目可继续使用。</p></div>`)}if(which==='recover')drawRecovery();facts()}
function closePanel(){saveBrief();s.panel='';pendingSpeech=null;if($('#panel').open)$('#panel').close();$('#panel').hidden=true;facts();if(opener?.isConnected&&!$('#menu').contains(opener))opener.focus();else $('#projectMenu').focus()}
function saveBrief(){if(s.briefDirty){s.briefDirty=false;s.review=true;$('#briefBadge').hidden=false;$('#briefStatus')&&($('#briefStatus').textContent='已保存 · 待复核');s.message='创作说明已保存；当前修订待复核，既有 Preview 仍可查看。';$('#message').textContent=s.message;facts()}}
function modal(title,body,confirm,label){$('#dialog').innerHTML=`<h2>${title}</h2><p>${body}</p><footer>${button('cancelDialog','取消')}${button(confirm,label,true)}</footer>`;$('#dialog').showModal();$('#dialog button').focus()}
function drawLost(){ $('#blocker').hidden=!s.lost;if(!s.lost)return;$('#blocker').innerHTML='<h1>项目身份已失效，编辑已停止</h1><p>原项目目录已被替换。未保存的 Scene 修改已保留，不能继续写入原目录。</p><h3>抢救未保存编辑</h3><p>先将恢复快照导出到项目外。恢复时还需要内容匹配的项目来源；快照不包含 Asset 或 Speech。</p><div class="row wrap">'+button('export',s.exported?'再次导出恢复快照':'导出恢复快照',true)+button('leaveLost','返回项目入口')+'</div><p role="status">'+(s.exported?'已导出（模拟，没有创建文件）。':'模拟场景：有尚未保存的 Scene 修改。')+'</p>'}
function drawRecovery(){shell('恢复未保存的编辑',recoveryStage===0?`<p>${recoveryFiles.snapshot?'使用下方原项目检查可恢复的内容。此时不会创建或修改项目。':'先选择保存了未落盘编辑的恢复快照文件。'}</p><div class="recovery-field"><div class="row"><strong>恢复快照</strong>${button('pickSnapshot',recoveryFiles.snapshot?'更换文件':'选择快照文件',!recoveryFiles.snapshot)}</div><p>${recoveryFiles.snapshot?'雨后散步.narracut-recovery.json（模拟）':'快照保存旁白或创作说明修改；素材仍在原项目中。'}</p></div>${recoveryFiles.snapshot?`<div class="recovery-summary"><div class="row"><strong>原项目目录</strong>${button('pickSource','更换目录')}</div><p>/示例/雨后散步</p><p class="muted">来自快照中的位置提示。点击下方按钮，即明确使用此目录检查；内容不匹配时无法继续。</p></div><footer>${button('close','取消')}${button('inspectRecovery','使用此目录并检查',true)}</footer>`:''}`:`<h3>可以恢复 1 处未保存的修改</h3><p>Scene 1 的旁白将恢复。创作说明没有未保存修改。</p><p class="muted">原项目已匹配（模拟）。素材、Speech、程序与历史从原项目复制。</p><div class="recovery-summary"><div class="row"><strong>另存为</strong>${button('pickTarget','更改位置')}</div><p>/示例/雨后散步-恢复</p><p class="muted">新位置可用（模拟），原项目与快照保持不变。</p></div><footer>${button('editRecovery','返回')}${button('restore','恢复并打开项目',true)}</footer>`);facts()}
function generate(i){s.scenes[i].speech=true;s.message=`Scene ${i+1} Speech 已生成（模拟，无真实音频）。`;drawRows();$('#message').textContent=s.message;facts()}
function act(a){switch(a){case'brief':case'tts':case'checks':case'history':case'recover':openPanel(a);break;case'close':closePanel();break;case'cancelDialog':$('#dialog').close();break;case'createForm':$('#launcher').innerHTML='<h1>创建项目</h1><p class="muted">选择位置，为项目文件夹命名，然后开始写旁白。</p><label>项目文件夹名<input id="folderName" placeholder="例如：雨后散步" value="雨后散步"></label><p>'+button('pickParent','选择存放位置')+'</p><p id="parentPath" class="path">尚未选择位置</p><div class="row">'+button('home','返回')+button('create','创建并打开',true,true)+'</div>';break;case'home':launcher();break;case'pickParent':newName=$('#folderName').value;modal('系统目录选择边界','正式实现会打开系统目录选择窗口；此处使用合成目录 /示例/视频。取消不会创建项目。','parentPicked','模拟选择此位置');break;case'parentPicked':$('#dialog').close();parentPicked=true;$('#parentPath').textContent='/示例/视频';document.querySelector('[data-action="create"]').disabled=!$('#folderName').value.trim();break;case'create':if(!parentPicked||!$('#folderName').value.trim())return;s.name=$('#folderName').value;s.project=true;s.work='table';s.candidate=false;s.selected=1;s.message='空项目已创建（模拟）。可以开始写旁白。';s.scenes=[];s.voice=null;s.brief='';s.review=false;render();break;case'pickOpen':modal('打开项目文件夹','正式实现会调用系统目录选择并验证项目。原型只载入合成的已有项目。','openExisting','模拟打开项目');break;case'openExisting':reset('existing');break;case'addFromCheck':closePanel();case'add':s.scenes.push({text:'',speech:false});s.selected=s.scenes.length;drawRows();let t=document.querySelector(`[data-text="${s.scenes.length-1}"]`);t.focus();t.scrollIntoView({block:'nearest'});facts();break;case'saveVoice':formVoice=$('#voice').value;if(s.voice!==formVoice&&s.scenes.some(x=>x.speech))modal('更换整部视频的声音？',`${s.scenes.filter(x=>x.speech).length} 个 Scene 的 Speech 将失效，需要重新生成。取消会保留原声音和已有 Speech。`,'applyVoice','更换声音');else act('applyVoice');break;case'applyVoice':if($('#dialog').open)$('#dialog').close();if(s.voice!==formVoice)s.scenes.forEach(x=>x.speech=false);s.voice=formVoice;let i=pendingSpeech;closePanel();if(i!==null)generate(i);else{s.message='声音配置已保存（模拟）。';drawRows();$('#message').textContent=s.message;facts()}break;case'gotoAgent':closePanel();setWork('agent');break;case'rollback':if(!s.candidate)modal('从历史修订创建候选？','会创建隔离候选。当前修订保持不变，需依据最新项目内容重新检查与接受。','confirmRollback','创建候选');break;case'confirmRollback':$('#dialog').close();s.candidate=true;closePanel();setWork('agent');break;case'switch':saveBrief();closePanel();s.project=false;render();break;case'export':modal('导出恢复快照','正式实现会选择项目外的新文件路径。原型不会创建文件。','exported','模拟导出');break;case'exported':$('#dialog').close();s.exported=true;drawLost();facts();break;case'leaveLost':if(!s.exported)modal('尚未导出未保存编辑','返回后将丢失仅保存在内存中的修改。可以取消并先导出。','confirmLeave','丢失修改并返回');else act('confirmLeave');break;case'confirmLeave':if($('#dialog').open)$('#dialog').close();reset('new');break;case'pickSnapshot':modal('选择恢复快照','此处只模拟选择一个有效的恢复快照文件。','snapshotPicked','模拟选择快照');break;case'snapshotPicked':$('#dialog').close();recoveryFiles={snapshot:true,source:false,target:true};drawRecovery();break;case'pickSource':modal('选择恢复来源','此处模拟来源内容全部匹配；真实流程若不匹配，会阻断恢复并说明差异。','sourcePicked','模拟匹配来源');break;case'sourcePicked':$('#dialog').close();recoveryFiles.source=true;drawRecovery();break;case'pickTarget':modal('选择恢复位置','正式实现会选择不存在的新项目路径；这里模拟 /示例/雨后散步-恢复。','targetPicked','模拟选择新位置');break;case'targetPicked':$('#dialog').close();recoveryFiles.target=true;drawRecovery();break;case'inspectRecovery':if(!recoveryFiles.snapshot)return;recoveryFiles.source=true;recoveryStage=1;drawRecovery();break;case'editRecovery':recoveryStage=0;drawRecovery();break;case'restore':closePanel();reset('existing');s.name='雨后散步-恢复';s.scenes[0].text='恢复出的未保存旁白（示例）。';s.scenes[0].speech=false;s.message='恢复成功（模拟）；原快照保持不变。';render();break}}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.scenario)reset(b.dataset.scenario);else if(b.dataset.action)act(b.dataset.action);else if(b.dataset.work){closePanel();setWork(b.dataset.work)}else if(b.dataset.select){s.selected=+b.dataset.select;drawRows();facts()}else if(b.dataset.speech!==undefined){let i=+b.dataset.speech;s.selected=i+1;if(!s.voice){pendingSpeech=i;openPanel('tts')}else generate(i)}else if(b.dataset.locate){let i=+b.dataset.locate;closePanel();s.selected=i;setWork('table');drawRows();document.querySelector(`[data-text="${i-1}"]`).focus();document.querySelector(`[data-text="${i-1}"]`).scrollIntoView({block:'center'});facts()}});

function autoSize(t){t.style.height='34px';t.style.height=Math.max(34,t.scrollHeight)+'px'}
document.addEventListener('change',e=>{if(e.target.id==='confirmSource'){recoveryFiles.source=e.target.checked;document.querySelector('[data-action="inspectRecovery"]').disabled=!Object.values(recoveryFiles).every(Boolean)}});
document.addEventListener('input',e=>{if(e.target.matches('[data-text]')){autoSize(e.target);let i=+e.target.dataset.text;s.scenes[i].text=e.target.value;s.scenes[i].speech=false;s.selected=i+1;e.target.closest('tr').querySelector('[data-speech]').disabled=!e.target.value.trim();let sb=e.target.closest('tr').querySelector('[data-speech]');sb.innerHTML=speechIcon(false);sb.title='生成 Speech';sb.setAttribute('aria-label',`Scene ${i+1} 生成 Speech`);e.target.closest('tr').querySelector('td:last-child span').textContent='未生成';facts()}if(e.target.id==='brief'){s.brief=e.target.value;s.briefDirty=true;$('#briefStatus').textContent='有未保存修改';facts()}if(e.target.id==='folderName')document.querySelector('[data-action="create"]').disabled=!parentPicked||!e.target.value.trim()});
document.addEventListener('focusin',e=>{if(e.target.matches('[data-text]'))autoSize(e.target)});
document.addEventListener('focusout',e=>{if(e.target.id==='brief')saveBrief();if(e.target.matches('[data-text]')){$('#message').textContent='旁白已保存（模拟）。';$('#checkButton').textContent=`项目检查 · ${s.scenes.filter(x=>!x.speech).length}`}});
$('#panel').addEventListener('cancel',e=>{e.preventDefault();closePanel()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#dialog').open){if(!$('#menu').hidden){$('#menu').hidden=true;$('#projectMenu').focus()}else if(s.panel)closePanel()}});reset();
</script></html>
