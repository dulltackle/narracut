<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%229%22 fill=%22%23E8628E%22/><path d=%22M9 23V9h4l6 8V9h4v14h-4l-6-8v8z%22 fill=%22white%22/></svg>" />
  <title>Narracut 主编辑器操作闭环 · 一次性原型</title>
  <!--
    PROTOTYPE — 一次性代码，用完即弃。
    三种主编辑器布局，通过 ?variant=A|B|C 切换；不接真实 TTS、转码或渲染。
    回答的问题：https://github.com/dulltackle/narracut/issues/20
  -->
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f5f7;
      --panel: #ffffff;
      --panel-soft: #f8fafb;
      --ink: #22282f;
      --muted: #68737d;
      --line: #dce2e7;
      --line-strong: #c5cdd5;
      --blue: #1e6fd9;
      --blue-soft: #eaf3ff;
      --blue-deep: #1657ac;
      --pink: #e8628e;
      --pink-soft: #fdf2f5;
      --amber: #d17b00;
      --amber-soft: #fff7e8;
      --red: #c63d45;
      --red-soft: #fff0f1;
      --green: #23865b;
      --green-soft: #eaf8f1;
      --stage: #2a2226;
      --shadow: 0 14px 40px rgba(29, 43, 57, 0.12);
      --r-sm: 7px;
      --r-md: 11px;
      --r-lg: 16px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-width: 1180px;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea, select { font: inherit; }
    button, select { cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    .app-shell {
      height: 100vh;
      display: grid;
      grid-template-rows: 56px minmax(0, 1fr);
    }

    .topbar {
      position: relative;
      z-index: 20;
      display: grid;
      grid-template-columns: minmax(280px, 1fr) auto minmax(360px, 1fr);
      align-items: center;
      gap: 16px;
      padding: 0 18px;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 1px 8px rgba(32, 42, 52, 0.05);
    }
    .brand-block, .top-actions, .save-state, .button-row, .inline-meta,
    .task-summary, .player-controls, .legend, .type-line, .diagnostic-meta {
      display: flex;
      align-items: center;
    }
    .brand-block { gap: 12px; min-width: 0; }
    .brand-mark {
      width: 30px; height: 30px; border-radius: 9px;
      display: grid; place-items: center;
      background: var(--pink); color: white; font-weight: 850; letter-spacing: -0.04em;
    }
    .project-title { min-width: 0; }
    .project-title strong { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .project-title span { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; }
    .save-state { gap: 7px; color: var(--muted); font-size: 11px; }
    .save-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
    .save-dot.saving { background: var(--amber); animation: breathe 1s infinite alternate; }
    .history-actions { justify-self: center; display: flex; gap: 4px; }
    .top-actions { justify-self: end; justify-content: flex-end; gap: 8px; }

    .btn {
      border: 1px solid var(--line-strong);
      border-radius: var(--r-sm);
      background: var(--panel);
      color: var(--ink);
      min-height: 32px;
      padding: 0 11px;
      font-size: 11px;
      font-weight: 680;
      white-space: nowrap;
    }
    .btn:hover { background: var(--panel-soft); border-color: #aeb8c1; }
    .btn.primary { background: var(--blue); border-color: var(--blue); color: white; }
    .btn.primary:hover { background: var(--blue-deep); }
    .btn.ghost { border-color: transparent; background: transparent; }
    .btn.icon { width: 32px; padding: 0; font-size: 15px; }
    .btn.danger { color: var(--red); border-color: #efc8cb; background: var(--red-soft); }
    .btn.small { min-height: 26px; padding: 0 8px; font-size: 10px; }
    .btn:disabled { opacity: 0.38; cursor: not-allowed; }
    .count-pill, .status-chip, .type-chip, .scene-chip, .estimate-chip, .severity-pill {
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 999px; white-space: nowrap; font-weight: 750;
    }
    .count-pill { min-width: 20px; height: 20px; padding: 0 6px; background: var(--red-soft); color: var(--red); font-size: 10px; }
    .task-trigger { position: relative; }
    .task-trigger .count-pill { position: absolute; right: -6px; top: -7px; }
    .render-wrap { display: flex; align-items: center; gap: 7px; }
    .warning-link { color: var(--amber); font-size: 10px; font-weight: 750; cursor: pointer; }
    .render-progress { width: 86px; }
    .render-progress-track { height: 5px; background: #d8e3ee; border-radius: 9px; overflow: hidden; }
    .render-progress-fill { height: 100%; background: var(--blue); transition: width 180ms linear; }
    .render-progress span { display: block; margin-top: 2px; font-size: 9px; color: var(--muted); text-align: right; }

    .workspace { min-height: 0; padding: 10px; gap: 10px; }
    .variant-a {
      display: grid;
      grid-template-columns: minmax(620px, 1.4fr) minmax(390px, 0.9fr);
      grid-template-rows: minmax(300px, 0.95fr) minmax(300px, 1.05fr);
    }
    .variant-a .scene-pane { grid-column: 1; grid-row: 1 / span 2; }
    .variant-a .player-pane { grid-column: 2; grid-row: 1; }
    .variant-a .inspector-pane { grid-column: 2; grid-row: 2; }

    .variant-b {
      display: grid;
      grid-template-columns: minmax(560px, 1.35fr) minmax(390px, 0.65fr);
      grid-template-rows: minmax(325px, 0.9fr) minmax(310px, 1.1fr);
    }
    .variant-b .player-pane { grid-column: 1; grid-row: 1; }
    .variant-b .inspector-pane { grid-column: 2; grid-row: 1; }
    .variant-b .scene-pane { grid-column: 1 / span 2; grid-row: 2; }

    .variant-c {
      display: grid;
      grid-template-columns: minmax(250px, 0.56fr) minmax(550px, 1.22fr) minmax(340px, 0.74fr);
      grid-template-rows: minmax(0, 1fr);
    }
    .variant-c .queue-pane { display: flex; }
    .variant-c .right-stack { min-height: 0; display: grid; grid-template-rows: minmax(260px, 0.82fr) minmax(340px, 1.18fr); gap: 10px; }

    .pane {
      min-width: 0; min-height: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      box-shadow: 0 2px 12px rgba(31, 45, 58, 0.045);
      overflow: hidden;
    }
    .pane-head {
      min-height: 43px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-soft);
    }
    .pane-title { min-width: 0; }
    .pane-title strong { font-size: 12px; }
    .pane-title span { margin-left: 7px; color: var(--muted); font-size: 10px; }
    .pane-body { min-height: 0; }

    /* Script Table */
    .scene-pane { display: grid; grid-template-rows: 43px minmax(0, 1fr); }
    .table-tools { display: flex; align-items: center; gap: 7px; }
    .filter-button[aria-pressed="true"] { background: var(--blue-soft); color: var(--blue-deep); border-color: #b9d6fb; }
    .scene-table-wrap { overflow: auto; min-height: 0; }
    .scene-table { width: 100%; min-width: 760px; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
    .scene-table th {
      position: sticky; top: 0; z-index: 3;
      height: 32px; padding: 0 8px;
      background: #f7f9fa;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 9px; font-weight: 780; letter-spacing: .06em; text-align: left; text-transform: uppercase;
    }
    .scene-table td { height: 58px; padding: 5px 7px; border-bottom: 1px solid #e9edf0; vertical-align: middle; background: white; }
    .scene-table tr { position: relative; }
    .scene-table tr:hover td { background: #fafbfd; }
    .scene-table tr.selected td { background: var(--pink-soft); }
    .scene-table tr.selected td:first-child { box-shadow: inset 3px 0 var(--pink); }
    .scene-table tr.playing td { border-bottom-color: #bdd6f7; }
    .scene-table tr.playing .scene-number { color: var(--blue); }
    .scene-table tr.dragging { opacity: 0.45; }
    .scene-table tr.drop-target td { box-shadow: inset 0 2px var(--blue); }
    .col-order { width: 56px; }
    .col-narration { width: 34%; }
    .col-type { width: 126px; }
    .col-asset { width: 126px; }
    .col-speech { width: 105px; }
    .col-status { width: 158px; }
    .order-cell { display: flex; align-items: center; gap: 5px; }
    .drag-handle { color: #a2abb3; cursor: grab; font-size: 14px; letter-spacing: -4px; }
    .scene-number { min-width: 22px; font-size: 10px; font-weight: 780; color: var(--muted); font-variant-numeric: tabular-nums; }
    .play-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
    .row-narration {
      width: 100%; min-height: 42px; max-height: 42px; resize: none;
      border: 1px solid transparent; border-radius: 6px; background: transparent;
      padding: 4px 5px; color: var(--ink); font-size: 11px; line-height: 1.45;
      overflow: hidden;
    }
    .row-narration:hover { border-color: var(--line); background: white; }
    .row-narration:focus { min-height: 64px; max-height: 100px; overflow: auto; background: white; border-color: var(--blue); }
    .row-narration::placeholder { color: var(--red); }
    .table-select {
      width: 100%; min-height: 29px; padding: 0 24px 0 7px;
      border: 1px solid var(--line); border-radius: 6px; background: white;
      color: var(--ink); font-size: 10px;
    }
    .cell-stack { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; }
    .cell-primary { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10px; font-weight: 700; }
    .cell-secondary { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 9px; }
    .cell-primary.ok { color: var(--green); }
    .cell-primary.error { color: var(--red); }
    .cell-primary.running { color: var(--blue); }
    .status-button { width: 100%; display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; align-items: center; gap: 5px; padding: 4px 5px; border: 0; border-radius: 6px; background: transparent; text-align: left; }
    .status-button:hover { background: var(--panel-soft); }
    .status-button .message { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 9px; }
    .severity-icon { font-size: 12px; font-weight: 900; }
    .severity-icon.error { color: var(--red); }
    .severity-icon.warning { color: var(--amber); }
    .ready-mark { color: var(--green); font-size: 15px; font-weight: 900; }

    /* Player */
    .player-pane { display: grid; grid-template-rows: 43px minmax(0, 1fr) 46px; }
    .player-stage-wrap { min-height: 0; padding: 12px; display: grid; place-items: center; background: #e5e8eb; overflow: hidden; }
    .player-frame {
      position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 100%; overflow: hidden;
      border-radius: 5px; background: var(--stage); box-shadow: 0 10px 30px rgba(18, 24, 30, 0.22); color: white;
    }
    .player-frame video, .player-frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #2a2226; }
    .faux-footage {
      position: absolute; inset: 0;
      background:
        radial-gradient(circle at 70% 38%, rgba(117, 164, 204, .42), transparent 22%),
        linear-gradient(125deg, #687887, #2e3a44 56%, #171d22);
    }
    .asset-placeholder { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 30px; color: #f3dfe2; background: repeating-linear-gradient(135deg, #2a2226 0 16px, #31282d 16px 32px); }
    .asset-placeholder .placeholder-icon { display: block; font-size: 27px; margin-bottom: 8px; }
    .asset-placeholder strong { display: block; font-size: 13px; }
    .asset-placeholder span { display: block; margin-top: 5px; color: #c7b9bf; font-size: 9px; }
    .caption {
      position: absolute; left: 4.2%; top: 8%; max-width: 64%;
      padding: 10px 13px; border-left: 5px solid var(--blue);
      background: linear-gradient(90deg, rgba(11, 46, 92, .94), rgba(11, 46, 92, .68));
      border-radius: 4px; box-shadow: 0 7px 24px rgba(0, 0, 0, .24);
    }
    .caption.alert { top: auto; bottom: 28%; border-left-color: #f59e0b; background: rgba(61, 36, 0, .93); }
    .caption small { display: block; margin-bottom: 3px; color: #bdd8fa; font-size: 8px; font-weight: 800; letter-spacing: .08em; }
    .caption.alert small { color: #ffd994; }
    .caption strong { display: block; font-size: clamp(12px, 1.25vw, 20px); }
    .subtitle {
      position: absolute; left: 5%; right: 5%; bottom: 7%;
      color: white; text-align: center; font-size: clamp(12px, 1.14vw, 18px); font-weight: 900;
      paint-order: stroke fill; -webkit-text-stroke: 1px rgba(20, 14, 17, .95);
      text-shadow: 0 2px 7px #000, 0 0 18px rgba(0, 0, 0, .9);
    }
    .subtitle.font-error { color: #ffd9dc; text-decoration: wavy underline var(--red); }
    .player-diagnostic {
      position: absolute; right: 8px; top: 8px; max-width: 54%;
      padding: 5px 7px; border-radius: 5px; background: rgba(168, 32, 42, .92); color: white; font-size: 8px; font-weight: 720;
    }
    .estimate-chip { position: absolute; left: 8px; bottom: 8px; padding: 4px 7px; background: rgba(255, 247, 232, .94); color: #805000; font-size: 8px; }
    .frame-corner { position: absolute; right: 7px; bottom: 6px; padding: 3px 5px; border-radius: 4px; background: rgba(0,0,0,.55); font-size: 7px; color: #d7dce0; }
    .player-controls { gap: 8px; padding: 8px 11px; border-top: 1px solid var(--line); background: var(--panel); }
    .play-button { width: 28px; height: 28px; border: 0; border-radius: 50%; background: var(--ink); color: white; }
    .timecode { min-width: 76px; color: var(--muted); font-size: 9px; font-variant-numeric: tabular-nums; }
    .scrubber { flex: 1; height: 5px; border-radius: 8px; background: #dfe4e8; overflow: hidden; }
    .scrubber > div { height: 100%; background: var(--blue); }
    .selected-note { color: var(--muted); font-size: 9px; white-space: nowrap; }

    /* Inspector */
    .inspector-pane { display: grid; grid-template-rows: 43px minmax(0, 1fr); }
    .inspector-scroll { overflow: auto; padding: 12px; }
    .section { padding-bottom: 13px; margin-bottom: 13px; border-bottom: 1px solid var(--line); }
    .section:last-child { border-bottom: 0; margin-bottom: 0; }
    .section-title { margin: 0 0 9px; color: var(--muted); font-size: 9px; font-weight: 820; letter-spacing: .09em; text-transform: uppercase; }
    .field { margin-bottom: 10px; }
    .field:last-child { margin-bottom: 0; }
    .field label { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; color: #4d5861; font-size: 9px; font-weight: 700; }
    .field input, .field textarea, .field select {
      width: 100%; border: 1px solid var(--line-strong); border-radius: 7px; background: white; color: var(--ink); padding: 7px 8px; font-size: 10px;
    }
    .field textarea { min-height: 66px; resize: vertical; line-height: 1.5; }
    .field.focus-target { padding: 7px; margin-left: -7px; margin-right: -7px; border-radius: 8px; background: var(--blue-soft); animation: focus-flash 1.4s ease-out; }
    .type-chip { padding: 4px 7px; background: #edf1f4; color: #48545e; font-size: 9px; }
    .asset-card, .speech-card { padding: 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-soft); }
    .asset-card strong, .speech-card strong { display: block; font-size: 10px; }
    .asset-card span, .speech-card span { display: block; margin: 4px 0 8px; color: var(--muted); font-size: 9px; word-break: break-all; }
    .diagnostic-card { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 6px; padding: 7px; margin-bottom: 6px; border-radius: 7px; background: var(--red-soft); color: #7f242a; font-size: 9px; line-height: 1.45; }
    .diagnostic-card.warning { background: var(--amber-soft); color: #6f4700; }
    .diagnostic-card button { grid-column: 2; justify-self: start; }
    .empty-state { padding: 25px 12px; color: var(--muted); text-align: center; font-size: 10px; }

    /* Repair queue / task drawer */
    .queue-pane { display: none; flex-direction: column; }
    .repair-summary { padding: 12px; border-bottom: 1px solid var(--line); background: linear-gradient(145deg, var(--red-soft), white 72%); }
    .repair-summary strong { display: block; font-size: 18px; }
    .repair-summary span { display: block; margin-top: 4px; color: var(--muted); font-size: 9px; line-height: 1.45; }
    .repair-list { flex: 1; min-height: 0; overflow: auto; padding: 8px; }
    .repair-item {
      width: 100%; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 7px;
      border: 0; border-radius: 8px; background: transparent; padding: 8px; margin-bottom: 4px; text-align: left; color: var(--ink);
    }
    .repair-item:hover, .repair-item.current { background: var(--blue-soft); }
    .repair-item.warning:hover, .repair-item.warning.current { background: var(--amber-soft); }
    .repair-index { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 6px; background: var(--red-soft); color: var(--red); font-size: 9px; font-weight: 850; }
    .repair-item.warning .repair-index { background: #ffedc5; color: var(--amber); }
    .repair-copy strong { display: block; font-size: 9px; line-height: 1.35; }
    .repair-copy span { display: block; margin-top: 3px; color: var(--muted); font-size: 8px; }
    .queue-footer { padding: 9px; border-top: 1px solid var(--line); }

    .drawer-backdrop { position: fixed; inset: 56px 0 0; z-index: 30; background: rgba(24, 31, 37, .25); }
    .drawer {
      position: fixed; z-index: 31; top: 64px; right: 8px; bottom: 60px; width: 350px;
      display: flex; flex-direction: column; background: white; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden;
    }
    .drawer.wide { width: 390px; }
    .drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 11px 12px; border-bottom: 1px solid var(--line); }
    .drawer-head strong { font-size: 12px; }
    .drawer-content { flex: 1; min-height: 0; overflow: auto; padding: 9px; }
    .job-item { padding: 9px; margin-bottom: 7px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-soft); }
    .job-item.failed { border-color: #edc4c7; background: var(--red-soft); }
    .job-top { display: flex; justify-content: space-between; gap: 8px; }
    .job-top strong { font-size: 10px; }
    .job-top span { color: var(--muted); font-size: 9px; }
    .job-item p { margin: 5px 0; color: var(--muted); font-size: 9px; line-height: 1.45; }
    .mini-progress { height: 5px; margin: 7px 0 3px; background: #dce3e8; border-radius: 9px; overflow: hidden; }
    .mini-progress div { height: 100%; background: var(--blue); }
    .job-actions { display: flex; gap: 5px; margin-top: 7px; }

    /* Prototype controls */
    .prototype-switcher {
      position: fixed; z-index: 80; left: 50%; bottom: 10px; transform: translateX(-50%);
      display: flex; align-items: center; gap: 5px; padding: 5px;
      border-radius: 999px; background: #1f252b; color: white; box-shadow: 0 10px 34px rgba(0,0,0,.28);
    }
    .prototype-switcher button { width: 30px; height: 30px; border: 0; border-radius: 50%; background: #353d45; color: white; font-size: 15px; }
    .prototype-switcher button:hover { background: var(--blue); }
    .variant-label { min-width: 190px; padding: 0 9px; text-align: center; font-size: 10px; font-weight: 750; }
    .prototype-badge { position: fixed; z-index: 79; left: 10px; bottom: 11px; padding: 6px 9px; border-radius: 7px; background: #fff4c7; color: #684d00; border: 1px solid #ead37a; font-size: 9px; font-weight: 780; }
    .scenario-controls { position: fixed; z-index: 79; right: 10px; bottom: 10px; display: flex; gap: 4px; padding: 4px; border-radius: 8px; background: rgba(255,255,255,.95); border: 1px solid var(--line); box-shadow: 0 5px 20px rgba(0,0,0,.09); }

    /* Modal / toast */
    .modal-backdrop { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; background: rgba(23, 30, 36, .48); }
    .modal { width: min(430px, 90vw); padding: 18px; border-radius: 14px; background: white; box-shadow: 0 24px 70px rgba(0,0,0,.28); }
    .modal h2 { margin: 0; font-size: 16px; }
    .modal p { margin: 8px 0; color: var(--muted); font-size: 11px; line-height: 1.55; }
    .loss-list { margin: 11px 0; padding: 9px 10px 9px 27px; border-radius: 8px; background: var(--red-soft); color: #7f242a; font-size: 10px; line-height: 1.65; }
    .caption-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin: 14px 0; }
    .choice-card { border: 1px solid var(--line-strong); border-radius: 9px; background: white; padding: 13px; text-align: left; }
    .choice-card:hover { border-color: var(--blue); background: var(--blue-soft); }
    .choice-card strong { display: block; font-size: 11px; }
    .choice-card span { display: block; margin-top: 5px; color: var(--muted); font-size: 9px; line-height: 1.45; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 7px; margin-top: 15px; }
    .toast { position: fixed; z-index: 100; left: 50%; top: 68px; transform: translateX(-50%); padding: 8px 12px; border-radius: 8px; background: #1f252b; color: white; box-shadow: var(--shadow); font-size: 10px; animation: toast-in 180ms ease-out; }

    @keyframes breathe { to { opacity: .35; } }
    @keyframes focus-flash { from { box-shadow: 0 0 0 3px rgba(30,111,217,.35); } to { box-shadow: none; } }
    @keyframes toast-in { from { opacity: 0; transform: translate(-50%, -7px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const fixtureNarrations = [
      "取 100 毫升生理盐水，加入一支盐酸利多卡因注射液",
      "从球囊连接管套装中取出连接管",
      "将连接管与治疗仪副泵接通",
      "将连接管与生理盐水瓶连接",
      "将双腔管的绿色接头暂时关闭",
      "将白色接头与连接管对接",
      "点击“通液排气”，排尽管内空气",
      "将双腔管缓慢置入宫腔内",
      "使用 5 毫升注射器与双腔管的绿色接头连接",
      "通过注射器向双腔管球囊内注气，实现锁宫",
      "点击“通液治疗”，进行输卵管通液；治疗仪将根据子宫内压力情况，自动调整通液量",
      "治疗完成后打开双腔管的绿色接头，解除锁宫",
      "将双腔管缓慢从宫腔内取出",
    ];

    const captionNames = [
      "准备药液", "准备连接管", "连接副泵", "连接盐水瓶", "暂时关闭绿色接头",
      "对接白色接头", "确认空气排尽𠮷", "置入双腔管", "连接注射器", "球囊注气锁宫",
      "开始通液治疗", "治疗完成后解除锁宫", "取出双腔管",
    ];

    function buildMixedScenes() {
      return fixtureNarrations.map((text, index) => {
        const n = index + 1;
        const alert = [5, 7, 12].includes(n);
        return {
          id: `20000000-0000-4000-8000-${String(n).padStart(12, "0")}`,
          order: n,
          narration: n === 4 ? "" : text,
          originalNarration: text,
          visual: n === 1
            ? { type: "image", asset: `assets/${String(n).padStart(2, "0")}.png`, caption: null }
            : [8, 13].includes(n)
              ? { type: "video", asset: `assets/${String(n).padStart(2, "0")}.mp4`, caption: null }
              : {
                  type: "video-caption",
                  asset: n === 5 || n === 10 ? null : `assets/${String(n).padStart(2, "0")}.mp4`,
                  caption: alert
                    ? { kind: "alert", text: captionNames[index] }
                    : { kind: "step", number: String(Math.max(1, n - 1)).padStart(2, "0"), name: captionNames[index] },
                },
          speech: [1, 4, 9, 12].includes(n) ? "missing" : "ready",
          duration: 2700 + (index % 4) * 430,
          lowResolution: n === 1,
          fileMissing: n === 11,
          mediaBad: n === 3,
          fontMissing: n === 7,
          assetJob: n === 10 ? "queued" : null,
          speechJob: n === 12 ? "running" : null,
        };
      });
    }

    const initialJobs = [
      { id: "job-transcode-10", kind: "transcode", sceneId: sceneId(10), status: "queued", progress: 0, title: "规范化 Scene 10 的视频" },
      { id: "job-speech-12", kind: "speech", sceneId: sceneId(12), status: "running", progress: 42, title: "生成 Scene 12 的 Speech" },
      { id: "job-render-old", kind: "render", sceneId: sceneId(11), status: "failed", progress: 63, title: "渲染 MP4", detail: "帧 604：Asset 文件不存在" },
    ];

    function sceneId(n) { return `20000000-0000-4000-8000-${String(n).padStart(12, "0")}`; }
    function clone(value) { return JSON.parse(JSON.stringify(value)); }

    const state = {
      scenes: buildMixedScenes(),
      selectedId: sceneId(3),
      playingSceneId: sceneId(3),
      playing: false,
      playProgress: .34,
      filter: "all",
      drawer: null,
      focusField: null,
      modal: null,
      toast: null,
      draggedId: null,
      jobs: clone(initialJobs),
      renderProgress: null,
      history: [],
      future: [],
      savePhase: "idle",
      scenario: "mixed",
    };

    const variantNames = {
      A: "全局工作台 · 表格主导",
      B: "预览工作室 · Player 主导",
      C: "修复通道 · 队列主导",
    };

    function getVariant() {
      const value = new URLSearchParams(location.search).get("variant")?.toUpperCase();
      return ["A", "B", "C"].includes(value) ? value : "A";
    }

    function setVariant(next) {
      const url = new URL(location.href);
      url.searchParams.set("variant", next);
      history.replaceState({}, "", url);
      renderApp();
    }

    function selectedScene() { return state.scenes.find((scene) => scene.id === state.selectedId); }
    function playingScene() { return state.scenes.find((scene) => scene.id === state.playingSceneId) ?? state.scenes[0]; }
    function requiresAsset(scene) { return ["image", "image-caption", "video", "video-caption"].includes(scene.visual.type); }
    function isCaptionVisual(type) { return type === "image-caption" || type === "video-caption"; }
    function mediaKind(type) { return type.startsWith("image") ? "image" : type.startsWith("video") ? "video" : null; }
    function visualLabel(type) {
      return ({
        title: "Title", image: "Image", "image-caption": "Image+Caption", video: "Video",
        "video-caption": "Video+Caption", "end-card": "EndCard",
      })[type] ?? type;
    }

    function sceneDiagnostics(scene) {
      const items = [];
      const add = (code, severity, field, message, action) => items.push({ code, severity, field, message, action, sceneId: scene.id });
      if (!scene.narration.trim()) add("NARRATION_EMPTY", "error", "narration", "Narration 为空", "恢复真实文案");
      if (requiresAsset(scene) && !scene.visual.asset) add("ASSET_UNBOUND", "error", "asset", scene.assetJob ? "Asset 尚在排队" : "尚未绑定 Asset", scene.assetJob ? "查看任务" : "导入 Asset");
      if (scene.fileMissing) add("ASSET_FILE_MISSING", "error", "asset", "Asset 文件不存在", "重新导入");
      if (scene.mediaBad) add("MEDIA_NONCOMPLIANT", "error", "asset", "视频不是规范化 H.264 Asset", "重新规范化");
      if (scene.fontMissing) add("FONT_GLYPH_MISSING", "error", "caption", "Caption 含字体未覆盖字符 U+20BB7", "移除缺字");
      if (scene.speech !== "ready") add("SPEECH_MISSING", "error", "speech", scene.speechJob ? "Speech 正在生成" : "缺少当前 Narration 的 Speech", scene.speechJob ? "查看任务" : "生成 Speech");
      if (scene.lowResolution) add("IMAGE_LOW_RESOLUTION", "warning", "asset", "图片低于 1920×1080，将被放大", "保留并忽略");
      return items;
    }

    function allDiagnostics() {
      const fieldOrder = { narration: 0, visual: 1, caption: 2, asset: 3, speech: 4 };
      return state.scenes.flatMap(sceneDiagnostics).sort((a, b) => {
        const severity = (a.severity === "error" ? 0 : 1) - (b.severity === "error" ? 0 : 1);
        if (severity) return severity;
        const sceneOrder = state.scenes.findIndex((s) => s.id === a.sceneId) - state.scenes.findIndex((s) => s.id === b.sceneId);
        if (sceneOrder) return sceneOrder;
        return (fieldOrder[a.field] ?? 9) - (fieldOrder[b.field] ?? 9);
      });
    }

    function counts() {
      const diagnostics = allDiagnostics();
      return {
        errors: diagnostics.filter((item) => item.severity === "error").length,
        warnings: diagnostics.filter((item) => item.severity === "warning").length,
        readyScenes: state.scenes.filter((scene) => !sceneDiagnostics(scene).some((item) => item.severity === "error")).length,
      };
    }

    function pushHistory() {
      state.history.push(clone(state.scenes));
      if (state.history.length > 100) state.history.shift();
      state.future = [];
      state.savePhase = "saving";
      clearTimeout(pushHistory.saveTimer);
      pushHistory.saveTimer = setTimeout(() => {
        state.savePhase = "idle";
        renderApp();
      }, 850);
    }

    function restoreScenes(snapshot) {
      state.scenes = clone(snapshot);
      if (!state.scenes.some((scene) => scene.id === state.selectedId)) state.selectedId = state.scenes[0].id;
      if (!state.scenes.some((scene) => scene.id === state.playingSceneId)) state.playingSceneId = state.scenes[0].id;
      renderApp();
    }

    function toast(message) {
      state.toast = message;
      renderApp();
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => { state.toast = null; renderApp(); }, 2100);
    }

    function headerTemplate() {
      const c = counts();
      const activeJobs = state.jobs.filter((job) => ["queued", "running", "failed"].includes(job.status));
      const renderButton = c.errors > 0 ? `检查并渲染 · ${c.errors}` : "渲染 MP4";
      return `
        <header class="topbar">
          <div class="brand-block">
            <div class="brand-mark">N</div>
            <div class="project-title"><strong>宫腔通液治疗仪操作演示</strong><span>13 Scene · 1920×1080 · 30fps</span></div>
            <div class="save-state"><i class="save-dot ${state.savePhase === "saving" ? "saving" : ""}"></i>${state.savePhase === "saving" ? "正在自动保存" : "已保存"}</div>
          </div>
          <div class="history-actions">
            <button class="btn icon ghost" data-action="undo" title="撤销" ${state.history.length ? "" : "disabled"}>↶</button>
            <button class="btn icon ghost" data-action="redo" title="重做" ${state.future.length ? "" : "disabled"}>↷</button>
          </div>
          <div class="top-actions">
            ${state.renderProgress !== null ? `
              <div class="render-progress"><div class="render-progress-track"><div class="render-progress-fill" style="width:${state.renderProgress}%"></div></div><span>正在渲染 ${state.renderProgress}%</span></div>
            ` : ""}
            <button class="btn task-trigger" data-action="toggle-tasks">任务 <span class="count-pill">${activeJobs.length}</span></button>
            <div class="render-wrap">
              ${c.warnings ? `<button class="btn ghost warning-link" data-action="open-warnings">${c.warnings} warning</button>` : ""}
              <button class="btn primary" data-action="render">${renderButton}</button>
            </div>
          </div>
        </header>`;
    }

    function visualOptions(scene) {
      const index = state.scenes.findIndex((item) => item.id === scene.id);
      const options = [
        ["title", "Title", index !== 0], ["image", "Image", false], ["image-caption", "Image+Caption", false],
        ["video", "Video", false], ["video-caption", "Video+Caption", false], ["end-card", "EndCard", index !== state.scenes.length - 1],
      ];
      return options.map(([value, label, disabled]) => `<option value="${value}" ${scene.visual.type === value ? "selected" : ""} ${disabled ? "disabled" : ""}>${label}${disabled ? "（位置受限）" : ""}</option>`).join("");
    }

    function sceneStatusCell(scene) {
      const diagnostics = sceneDiagnostics(scene);
      if (!diagnostics.length) return `<span class="ready-mark">✓</span><span class="cell-primary ok">Render-ready</span>`;
      const primary = diagnostics[0];
      return `<button class="status-button" data-action="locate-diagnostic" data-scene="${scene.id}" data-field="${primary.field}">
        <span class="severity-icon ${primary.severity}">${primary.severity === "error" ? "!" : "△"}</span>
        <span class="message">${escapeHtml(primary.message)}</span>
        ${diagnostics.length > 1 ? `<span class="count-pill">+${diagnostics.length - 1}</span>` : ""}
      </button>`;
    }

    function assetCell(scene) {
      if (!requiresAsset(scene)) return `<div class="cell-stack"><span class="cell-secondary">无需 Asset</span></div>`;
      if (scene.assetJob) return `<div class="cell-stack"><span class="cell-primary running">${scene.assetJob === "queued" ? "排队中" : "处理中"}</span><span class="cell-secondary">匹配提案待兑现</span></div>`;
      if (!scene.visual.asset) return `<div class="cell-stack"><span class="cell-primary error">未绑定</span><button class="btn small" data-action="start-asset" data-scene="${scene.id}">导入</button></div>`;
      return `<div class="cell-stack"><span class="cell-primary ${scene.fileMissing || scene.mediaBad ? "error" : "ok"}">${scene.fileMissing ? "文件缺失" : scene.mediaBad ? "不合规" : mediaKind(scene.visual.type) === "image" ? "图片已绑定" : "视频已绑定"}</span><span class="cell-secondary">${escapeHtml(scene.visual.asset.split("/").pop())}</span></div>`;
    }

    function speechCell(scene) {
      if (scene.speechJob) return `<div class="cell-stack"><span class="cell-primary running">生成中 · 42%</span><span class="cell-secondary">Speech Job</span></div>`;
      if (scene.speech === "ready") return `<div class="cell-stack"><span class="cell-primary ok">已生成</span><span class="cell-secondary">${(scene.duration / 1000).toFixed(1)}s</span></div>`;
      return `<div class="cell-stack"><span class="cell-primary error">缺少</span><button class="btn small" data-action="start-speech" data-scene="${scene.id}" ${scene.narration.trim() ? "" : "disabled"}>生成</button></div>`;
    }

    function tableTemplate() {
      const c = counts();
      const scenes = state.filter === "issues"
        ? state.scenes.filter((scene) => sceneDiagnostics(scene).length)
        : state.scenes;
      return `
        <section class="pane scene-pane">
          <div class="pane-head">
            <div class="pane-title"><strong>Script Table</strong><span>${c.readyScenes}/${state.scenes.length} Scene 就绪</span></div>
            <div class="table-tools">
              <button class="btn small filter-button" aria-pressed="${state.filter === "all"}" data-action="filter" data-filter="all">全部 13</button>
              <button class="btn small filter-button" aria-pressed="${state.filter === "issues"}" data-action="filter" data-filter="issues">待修复 ${state.scenes.length - c.readyScenes}</button>
            </div>
          </div>
          <div class="scene-table-wrap">
            <table class="scene-table">
              <colgroup><col class="col-order"/><col class="col-narration"/><col class="col-type"/><col class="col-asset"/><col class="col-speech"/><col class="col-status"/></colgroup>
              <thead><tr><th>顺序</th><th>Narration</th><th>Visual Type</th><th>Asset</th><th>Speech</th><th>状态</th></tr></thead>
              <tbody>
                ${scenes.map((scene) => `
                  <tr draggable="true" data-scene-row="${scene.id}" class="${scene.id === state.selectedId ? "selected" : ""} ${scene.id === state.playingSceneId ? "playing" : ""}">
                    <td><div class="order-cell"><span class="drag-handle" title="拖动重排">⠿</span><span class="scene-number">${String(state.scenes.indexOf(scene) + 1).padStart(2, "0")}</span>${scene.id === state.playingSceneId ? `<i class="play-dot" title="正在播放"></i>` : ""}</div></td>
                    <td><textarea class="row-narration" data-scene="${scene.id}" data-field="narration" placeholder="必填 Narration">${escapeHtml(scene.narration)}</textarea></td>
                    <td><select class="table-select" data-scene="${scene.id}" data-field="visual-type">${visualOptions(scene)}</select></td>
                    <td>${assetCell(scene)}</td>
                    <td>${speechCell(scene)}</td>
                    <td>${sceneStatusCell(scene)}</td>
                  </tr>`).join("")}
              </tbody>
            </table>
          </div>
        </section>`;
    }

    function playerTemplate() {
      const scene = playingScene();
      const index = state.scenes.findIndex((item) => item.id === scene.id);
      const diags = sceneDiagnostics(scene);
      const assetBroken = !scene.visual.asset || scene.fileMissing || scene.mediaBad || scene.assetJob;
      const caption = scene.visual.caption;
      const approximateFrame = Math.round(state.playProgress * Math.ceil(scene.duration / 1000 * 30));
      return `
        <section class="pane player-pane">
          <div class="pane-head">
            <div class="pane-title"><strong>Player</strong><span>正在播放 Scene ${String(index + 1).padStart(2, "0")}</span></div>
            <div class="inline-meta"><span class="type-chip">${visualLabel(scene.visual.type)}</span></div>
          </div>
          <div class="player-stage-wrap">
            <div class="player-frame" data-action="toggle-play">
              ${assetBroken
                ? `<div class="asset-placeholder"><div><span class="placeholder-icon">▧</span><strong>${scene.assetJob ? "Asset 正在处理" : scene.mediaBad ? "Asset 无法按规范预览" : "Asset 不可用"}</strong><span>保留 Caption 与 Subtitle 层，损坏的 Asset 层使用占位</span></div></div>`
                : mediaKind(scene.visual.type) === "image"
                  ? `<img src="../fixtures/clips/1.png" alt="Scene 1 静态图片 Asset" />`
                  : `<video src="../fixtures/clips/${index + 1}.mp4" muted loop autoplay playsinline></video><div class="faux-footage" style="opacity:.18"></div>`}
              ${caption ? `<div class="caption ${caption.kind === "alert" ? "alert" : ""}"><small>${caption.kind === "alert" ? "⚠ 操作警示" : `STEP ${escapeHtml(caption.number)}`}</small><strong>${escapeHtml(caption.kind === "alert" ? caption.text : caption.name)}</strong></div>` : ""}
              <div class="subtitle ${scene.fontMissing ? "font-error" : ""}">${scene.narration.trim() ? escapeHtml(scene.narration) : "Narration 为空，无法生成 Subtitle"}</div>
              ${scene.speech !== "ready" ? `<span class="estimate-chip">Draft Duration · 时长估算</span>` : ""}
              ${diags.some((item) => item.code === "FONT_GLYPH_MISSING") ? `<button class="player-diagnostic" data-action="locate-diagnostic" data-scene="${scene.id}" data-field="caption">字体不覆盖 U+20BB7 · 定位 Caption</button>` : ""}
              <span class="frame-corner">Scene ${index + 1} · local frame ${approximateFrame}</span>
            </div>
          </div>
          <div class="player-controls">
            <button class="play-button" data-action="toggle-play" aria-label="${state.playing ? "暂停" : "播放"}">${state.playing ? "Ⅱ" : "▶"}</button>
            <span class="timecode">${formatTime(state.playProgress * scene.duration)} / ${formatTime(scene.duration)}</span>
            <div class="scrubber"><div style="width:${state.playProgress * 100}%"></div></div>
            <span class="selected-note">Inspector：Scene ${String(state.scenes.findIndex((item) => item.id === state.selectedId) + 1).padStart(2, "0")}</span>
          </div>
        </section>`;
    }

    function fieldClass(name) { return state.focusField === name ? "field focus-target" : "field"; }

    function inspectorTemplate() {
      const scene = selectedScene();
      if (!scene) return `<section class="pane inspector-pane"><div class="empty-state">请选择 Scene</div></section>`;
      const index = state.scenes.findIndex((item) => item.id === scene.id);
      const diags = sceneDiagnostics(scene);
      const caption = scene.visual.caption;
      return `
        <section class="pane inspector-pane">
          <div class="pane-head">
            <div class="pane-title"><strong>Inspector</strong><span>Scene ${String(index + 1).padStart(2, "0")}</span></div>
            <span class="type-chip">${visualLabel(scene.visual.type)}</span>
          </div>
          <div class="inspector-scroll">
            <div class="section">
              <p class="section-title">Narration</p>
              <div class="${fieldClass("narration")}">
                <label>旁白文本 <span>${scene.narration.length} 字</span></label>
                <textarea data-scene="${scene.id}" data-field="narration">${escapeHtml(scene.narration)}</textarea>
              </div>
            </div>
            <div class="section">
              <p class="section-title">Visual</p>
              <div class="${fieldClass("visual")}"><label>Visual Type</label><select data-scene="${scene.id}" data-field="visual-type">${visualOptions(scene)}</select></div>
              ${caption ? `
                <div class="${fieldClass("caption")}">
                  <label>Caption 语义</label>
                  <select data-scene="${scene.id}" data-field="caption-kind"><option value="step" ${caption.kind === "step" ? "selected" : ""}>Step</option><option value="alert" ${caption.kind === "alert" ? "selected" : ""}>Alert</option></select>
                </div>
                ${caption.kind === "step" ? `
                  <div class="field"><label>步骤序号</label><input data-scene="${scene.id}" data-field="caption-number" value="${escapeAttr(caption.number)}" /></div>
                  <div class="field"><label>步骤名</label><input data-scene="${scene.id}" data-field="caption-name" value="${escapeAttr(caption.name)}" /></div>
                ` : `<div class="field"><label>警示文字</label><input data-scene="${scene.id}" data-field="caption-text" value="${escapeAttr(caption.text)}" /></div>`}
              ` : ""}
            </div>
            <div class="section">
              <p class="section-title">Asset & Speech</p>
              <div class="${fieldClass("asset")}">
                <div class="asset-card"><strong>${requiresAsset(scene) ? (scene.visual.asset ? "已绑定 Asset" : "未绑定 Asset") : "此 Visual 不需要 Asset"}</strong><span>${scene.visual.asset ? escapeHtml(scene.visual.asset) : "从具体 Scene 导入单个文件；成功后才兑现匹配提案。"}</span>${requiresAsset(scene) ? `<div class="button-row"><button class="btn small" data-action="start-asset" data-scene="${scene.id}" ${scene.assetJob ? "disabled" : ""}>${scene.visual.asset ? "替换" : "导入"}</button>${scene.visual.asset ? `<button class="btn small" data-action="clear-asset" data-scene="${scene.id}">清除</button>` : ""}</div>` : ""}</div>
              </div>
              <div class="${fieldClass("speech")}">
                <div class="speech-card"><strong>${scene.speechJob ? "Speech 正在生成" : scene.speech === "ready" ? "Speech 与 Narration 匹配" : "缺少 Speech"}</strong><span>${scene.speech === "ready" ? `speech/&lt;sceneId&gt;.mp3 · ${(scene.duration / 1000).toFixed(1)}s` : "草稿预览暂用 Draft Duration；最终渲染会阻止。"}</span><button class="btn small" data-action="start-speech" data-scene="${scene.id}" ${scene.speechJob || !scene.narration.trim() ? "disabled" : ""}>${scene.speech === "ready" ? "重新生成" : "生成 Speech"}</button></div>
              </div>
            </div>
            <div class="section">
              <p class="section-title">诊断 · ${diags.length}</p>
              ${diags.length ? diags.map((diag) => diagnosticCard(diag)).join("") : `<div class="diagnostic-card" style="background:var(--green-soft);color:var(--green)"><span>✓</span><div>此 Scene 已 Render-ready。</div></div>`}
            </div>
          </div>
        </section>`;
    }

    function diagnosticCard(diag) {
      return `<div class="diagnostic-card ${diag.severity}"><span>${diag.severity === "error" ? "!" : "△"}</span><div><strong>${escapeHtml(diag.message)}</strong><br><span>${diag.code} · ${diag.field}</span></div><button class="btn small" data-action="fix-diagnostic" data-scene="${diag.sceneId}" data-code="${diag.code}">${escapeHtml(diag.action)}</button></div>`;
    }

    function repairQueueTemplate(inPane = true) {
      const diagnostics = allDiagnostics();
      const c = counts();
      const content = `
        <div class="repair-summary"><strong>${c.errors ? `还差 ${c.errors} 项` : "可以渲染"}</strong><span>${c.errors ? "按 Scene 与字段依赖排序；先修 Narration，再修 Visual / Asset，最后生成 Speech。" : `${c.warnings} 项 warning 不阻止渲染。`}</span></div>
        <div class="repair-list">
          ${diagnostics.map((diag, i) => {
            const sceneIndex = state.scenes.findIndex((scene) => scene.id === diag.sceneId) + 1;
            return `<button class="repair-item ${diag.severity} ${state.selectedId === diag.sceneId && state.focusField === diag.field ? "current" : ""}" data-action="locate-diagnostic" data-scene="${diag.sceneId}" data-field="${diag.field}"><span class="repair-index">${diag.severity === "error" ? i + 1 : "△"}</span><span class="repair-copy"><strong>${escapeHtml(diag.message)}</strong><span>Scene ${String(sceneIndex).padStart(2, "0")} · ${diag.field}</span></span></button>`;
          }).join("") || `<div class="empty-state">没有诊断。项目可以渲染。</div>`}
        </div>
        <div class="queue-footer"><button class="btn primary" style="width:100%" data-action="render">${c.errors ? `从第 1 项开始修复` : "渲染 MP4"}</button></div>`;
      return inPane ? `<section class="pane queue-pane">${content}</section>` : content;
    }

    function taskDrawerTemplate() {
      if (state.drawer !== "tasks") return "";
      return `<div class="drawer-backdrop" data-action="close-drawer"></div><aside class="drawer">
        <div class="drawer-head"><strong>任务 · 当前页面会话</strong><button class="btn icon ghost" data-action="close-drawer">×</button></div>
        <div class="drawer-content">
          ${state.jobs.map((job) => {
            const sceneIndex = job.sceneId ? state.scenes.findIndex((scene) => scene.id === job.sceneId) + 1 : null;
            return `<div class="job-item ${job.status === "failed" ? "failed" : ""}"><div class="job-top"><strong>${escapeHtml(job.title)}</strong><span>${jobStatusLabel(job.status)}</span></div><p>${sceneIndex ? `Scene ${String(sceneIndex).padStart(2, "0")} · ` : ""}${escapeHtml(job.detail ?? job.kind)}</p>${job.status === "running" ? `<div class="mini-progress"><div style="width:${job.progress}%"></div></div>` : ""}<div class="job-actions">${job.sceneId ? `<button class="btn small" data-action="locate-job" data-scene="${job.sceneId}" data-field="${job.kind === "speech" ? "speech" : "asset"}">定位</button>` : ""}${job.status === "failed" && job.kind === "render" ? `<button class="btn small" data-action="locate-job" data-scene="${job.sceneId}" data-field="asset">从帧 604 定位</button>` : ""}</div></div>`;
          }).join("")}
        </div>
      </aside>`;
    }

    function repairDrawerTemplate() {
      if (state.drawer !== "repair") return "";
      return `<div class="drawer-backdrop" data-action="close-drawer"></div><aside class="drawer wide"><div class="drawer-head"><strong>Render-ready 修复队列</strong><button class="btn icon ghost" data-action="close-drawer">×</button></div>${repairQueueTemplate(false)}</aside>`;
    }

    function VariantA() {
      return `<main class="workspace variant-a">${tableTemplate()}${playerTemplate()}${inspectorTemplate()}</main>`;
    }
    function VariantB() {
      return `<main class="workspace variant-b">${playerTemplate()}${inspectorTemplate()}${tableTemplate()}</main>`;
    }
    function VariantC() {
      return `<main class="workspace variant-c">${repairQueueTemplate(true)}${tableTemplate()}<div class="right-stack">${playerTemplate()}${inspectorTemplate()}</div></main>`;
    }

    function modalTemplate() {
      if (!state.modal) return "";
      if (state.modal.kind === "caption-kind") {
        return `<div class="modal-backdrop"><div class="modal"><h2>选择 Caption 语义</h2><p>选择后才会原子提交新的 Visual。DSL 不会出现缺少判别字段的中间状态。</p><div class="caption-choices"><button class="choice-card" data-action="choose-caption" data-kind="step"><strong>Step</strong><span>步骤序号 + 步骤名</span></button><button class="choice-card" data-action="choose-caption" data-kind="alert"><strong>Alert</strong><span>警示图标 + 独立警示位置</span></button></div><div class="modal-actions"><button class="btn" data-action="cancel-modal">取消</button></div></div></div>`;
      }
      return `<div class="modal-backdrop"><div class="modal"><h2>切换会删除当前字段</h2><p>兼容字段会迁移；下面这些字段无法进入新的 Visual。确认后仍可用 Undo 恢复。</p><ul class="loss-list">${state.modal.losses.map((loss) => `<li>${escapeHtml(loss)}</li>`).join("")}</ul><div class="modal-actions"><button class="btn" data-action="cancel-modal">取消</button><button class="btn danger" data-action="confirm-switch">删除并切换</button></div></div></div>`;
    }

    function prototypeControls(variant) {
      return `<div class="prototype-badge">一次性原型 · 非产品代码</div><div class="prototype-switcher"><button data-action="prev-variant" aria-label="上一个布局">←</button><div class="variant-label">${variant} — ${variantNames[variant]}</div><button data-action="next-variant" aria-label="下一个布局">→</button></div><div class="scenario-controls"><button class="btn small" data-action="scenario" data-scenario="mixed" ${state.scenario === "mixed" ? "disabled" : ""}>混合问题</button><button class="btn small" data-action="scenario" data-scenario="warnings" ${state.scenario === "warnings" ? "disabled" : ""}>仅保留 Warning</button></div>`;
    }

    function renderApp() {
      const variant = getVariant();
      const body = variant === "B" ? VariantB() : variant === "C" ? VariantC() : VariantA();
      document.getElementById("app").innerHTML = `<div class="app-shell">${headerTemplate()}${body}</div>${taskDrawerTemplate()}${repairDrawerTemplate()}${modalTemplate()}${prototypeControls(variant)}${state.toast ? `<div class="toast">${escapeHtml(state.toast)}</div>` : ""}`;
      syncPreviewVideo();
    }

    function syncPreviewVideo() {
      const video = document.querySelector(".player-frame video");
      if (!video) return;
      video.muted = true;
      if (state.playing) video.play().catch(() => {}); else video.pause();
    }

    function requestVisualSwitch(scene, target) {
      if (scene.visual.type === target) return;
      const losses = [];
      if (scene.visual.caption && !isCaptionVisual(target)) losses.push("当前 Caption（Step / Alert 内容）");
      if (scene.visual.asset && mediaKind(scene.visual.type) !== mediaKind(target)) losses.push("当前 Asset 绑定");
      const needsCaption = isCaptionVisual(target) && !scene.visual.caption;
      state.modal = needsCaption
        ? { kind: "caption-kind", sceneId: scene.id, target, losses }
        : losses.length
          ? { kind: "confirm-switch", sceneId: scene.id, target, losses }
          : null;
      if (!state.modal) applyVisualSwitch(scene, target, scene.visual.caption?.kind);
      renderApp();
    }

    function applyVisualSwitch(scene, target, captionKind) {
      pushHistory();
      const oldKind = mediaKind(scene.visual.type);
      const newKind = mediaKind(target);
      const asset = oldKind && oldKind === newKind ? scene.visual.asset : null;
      let visual;
      if (target === "title") visual = { type: "title", device: "GX-3000 妇科诊断系统", headline: "宫腔通液操作", subheadline: "标准操作演示" };
      else if (target === "end-card") visual = { type: "end-card", title: "本节要点", bullets: ["规范连接", "排尽空气", "治疗后解除锁宫"] };
      else if (isCaptionVisual(target)) {
        const oldCaption = scene.visual.caption;
        const kind = captionKind ?? oldCaption?.kind ?? "step";
        const caption = oldCaption && oldCaption.kind === kind ? clone(oldCaption) : kind === "alert" ? { kind: "alert", text: "填写警示文字" } : { kind: "step", number: "", name: "填写步骤名" };
        visual = { type: target, asset, caption };
      } else visual = { type: target, asset };
      scene.visual = visual;
      scene.fileMissing = false;
      scene.mediaBad = false;
      state.modal = null;
      renderApp();
    }

    function selectAndSeek(sceneId, field = null) {
      state.selectedId = sceneId;
      state.playingSceneId = sceneId;
      state.playProgress = 0;
      state.focusField = field;
      state.drawer = null;
      renderApp();
    }

    function startJob(sceneId, kind) {
      const scene = state.scenes.find((item) => item.id === sceneId);
      if (!scene) return;
      const id = `job-${kind}-${Date.now()}`;
      const title = kind === "speech" ? `生成 Scene ${state.scenes.indexOf(scene) + 1} 的 Speech` : `导入 Scene ${state.scenes.indexOf(scene) + 1} 的 Asset`;
      state.jobs.unshift({ id, kind, sceneId, status: "running", progress: 8, title });
      if (kind === "speech") scene.speechJob = "running"; else scene.assetJob = "running";
      renderApp();
      const timer = setInterval(() => {
        const job = state.jobs.find((item) => item.id === id);
        if (!job) return clearInterval(timer);
        job.progress = Math.min(100, job.progress + 19);
        if (job.progress >= 100) {
          clearInterval(timer);
          pushHistory();
          job.status = "succeeded";
          if (kind === "speech") { scene.speech = "ready"; scene.speechJob = null; }
          else { scene.visual.asset = `assets/${String(state.scenes.indexOf(scene) + 1).padStart(2, "0")}.${mediaKind(scene.visual.type) === "image" ? "png" : "mp4"}`; scene.assetJob = null; scene.fileMissing = false; scene.mediaBad = false; }
          toast(`${title}：完成`);
        } else renderApp();
      }, 480);
    }

    function fixDiagnostic(sceneId, code) {
      const scene = state.scenes.find((item) => item.id === sceneId);
      if (!scene) return;
      if (code === "NARRATION_EMPTY") { pushHistory(); scene.narration = scene.originalNarration; scene.speech = "missing"; toast("已恢复真实文案；Speech 仍需生成"); }
      else if (code === "ASSET_UNBOUND" || code === "ASSET_FILE_MISSING") startJob(sceneId, "transcode");
      else if (code === "MEDIA_NONCOMPLIANT") startJob(sceneId, "transcode");
      else if (code === "FONT_GLYPH_MISSING") { pushHistory(); scene.fontMissing = false; if (scene.visual.caption?.kind === "step") scene.visual.caption.name = scene.visual.caption.name.replace("𠮷", ""); toast("已移除字体未覆盖字符"); }
      else if (code === "SPEECH_MISSING") { if (scene.speechJob) state.drawer = "tasks"; else startJob(sceneId, "speech"); }
      else if (code === "IMAGE_LOW_RESOLUTION") { pushHistory(); scene.lowResolution = false; toast("已接受低分辨率 warning；Asset 不变"); }
      renderApp();
    }

    function setScenario(name) {
      state.scenario = name;
      state.scenes = buildMixedScenes();
      state.jobs = clone(initialJobs);
      state.renderProgress = null;
      state.history = [];
      state.future = [];
      if (name === "warnings") {
        state.scenes.forEach((scene) => {
          scene.narration = scene.originalNarration;
          scene.speech = "ready";
          scene.speechJob = null;
          scene.assetJob = null;
          scene.fileMissing = false;
          scene.mediaBad = false;
          scene.fontMissing = false;
          if (requiresAsset(scene) && !scene.visual.asset) scene.visual.asset = `assets/${String(scene.order).padStart(2, "0")}.mp4`;
        });
        state.jobs = [];
      }
      state.selectedId = sceneId(1);
      state.playingSceneId = sceneId(1);
      state.focusField = null;
      state.drawer = null;
      renderApp();
    }

    function startRender() {
      if (counts().errors) { state.drawer = "repair"; renderApp(); return; }
      if (state.renderProgress !== null) return;
      state.drawer = null;
      state.renderProgress = 0;
      const job = { id: `job-render-${Date.now()}`, kind: "render", status: "running", progress: 0, title: "渲染 MP4" };
      state.jobs.unshift(job);
      renderApp();
      const timer = setInterval(() => {
        state.renderProgress = Math.min(100, state.renderProgress + 8);
        job.progress = state.renderProgress;
        if (state.renderProgress >= 100) {
          clearInterval(timer);
          job.status = "succeeded";
          state.renderProgress = null;
          toast("渲染完成 · renders/2026-08-12T08-30-00/");
        } else renderApp();
      }, 380);
    }

    function formatTime(ms) {
      const total = Math.max(0, ms) / 1000;
      const minutes = Math.floor(total / 60);
      const seconds = Math.floor(total % 60);
      const tenths = Math.floor((total % 1) * 10);
      return `${minutes}:${String(seconds).padStart(2, "0")}.${tenths}`;
    }
    function escapeHtml(value = "") { return String(value).replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" })[char]); }
    function escapeAttr(value = "") { return escapeHtml(value); }
    function jobStatusLabel(status) { return ({ queued: "排队", running: "运行中", failed: "失败", succeeded: "完成", canceled: "已取消" })[status] ?? status; }

    document.addEventListener("click", (event) => {
      const button = event.target.closest("[data-action]");
      if (!button) {
        const row = event.target.closest("[data-scene-row]");
        if (row && !event.target.matches("textarea, select, button")) selectAndSeek(row.dataset.sceneRow);
        return;
      }
      const action = button.dataset.action;
      if (action === "prev-variant" || action === "next-variant") {
        const keys = ["A", "B", "C"]; const index = keys.indexOf(getVariant());
        setVariant(keys[(index + (action === "next-variant" ? 1 : 2)) % 3]);
      } else if (action === "filter") { state.filter = button.dataset.filter; renderApp(); }
      else if (action === "toggle-play") { state.playing = !state.playing; renderApp(); }
      else if (action === "locate-diagnostic" || action === "locate-job") selectAndSeek(button.dataset.scene, button.dataset.field);
      else if (action === "toggle-tasks") { state.drawer = state.drawer === "tasks" ? null : "tasks"; renderApp(); }
      else if (action === "close-drawer") { state.drawer = null; renderApp(); }
      else if (action === "open-warnings") { state.drawer = "repair"; renderApp(); }
      else if (action === "render") startRender();
      else if (action === "start-asset") startJob(button.dataset.scene, "transcode");
      else if (action === "start-speech") startJob(button.dataset.scene, "speech");
      else if (action === "clear-asset") { const scene = state.scenes.find((item) => item.id === button.dataset.scene); pushHistory(); scene.visual.asset = null; renderApp(); }
      else if (action === "fix-diagnostic") fixDiagnostic(button.dataset.scene, button.dataset.code);
      else if (action === "cancel-modal") { state.modal = null; renderApp(); }
      else if (action === "choose-caption") { const scene = state.scenes.find((item) => item.id === state.modal.sceneId); applyVisualSwitch(scene, state.modal.target, button.dataset.kind); }
      else if (action === "confirm-switch") { const scene = state.scenes.find((item) => item.id === state.modal.sceneId); applyVisualSwitch(scene, state.modal.target, scene.visual.caption?.kind); }
      else if (action === "scenario") setScenario(button.dataset.scenario);
      else if (action === "undo" && state.history.length) { state.future.push(clone(state.scenes)); restoreScenes(state.history.pop()); }
      else if (action === "redo" && state.future.length) { state.history.push(clone(state.scenes)); restoreScenes(state.future.pop()); }
    });

    document.addEventListener("change", (event) => {
      const sceneId = event.target.dataset.scene;
      const field = event.target.dataset.field;
      if (!sceneId || !field) return;
      const scene = state.scenes.find((item) => item.id === sceneId);
      if (!scene) return;
      state.selectedId = sceneId;
      if (field === "visual-type") requestVisualSwitch(scene, event.target.value);
      else {
        pushHistory();
        if (field === "narration") { scene.narration = event.target.value; scene.speech = "missing"; }
        else if (field === "caption-kind") scene.visual.caption = event.target.value === "alert" ? { kind: "alert", text: "填写警示文字" } : { kind: "step", number: "", name: "填写步骤名" };
        else if (field === "caption-number") scene.visual.caption.number = event.target.value;
        else if (field === "caption-name") scene.visual.caption.name = event.target.value;
        else if (field === "caption-text") scene.visual.caption.text = event.target.value;
        renderApp();
      }
    });

    document.addEventListener("dragstart", (event) => {
      const row = event.target.closest("[data-scene-row]");
      if (!row) return;
      state.draggedId = row.dataset.sceneRow;
      row.classList.add("dragging");
      event.dataTransfer.effectAllowed = "move";
    });
    document.addEventListener("dragover", (event) => {
      const row = event.target.closest("[data-scene-row]");
      if (!row || row.dataset.sceneRow === state.draggedId) return;
      event.preventDefault();
      document.querySelectorAll(".drop-target").forEach((item) => item.classList.remove("drop-target"));
      row.classList.add("drop-target");
    });
    document.addEventListener("drop", (event) => {
      const row = event.target.closest("[data-scene-row]");
      if (!row || !state.draggedId || row.dataset.sceneRow === state.draggedId) return;
      event.preventDefault();
      const sourceIndex = state.scenes.findIndex((scene) => scene.id === state.draggedId);
      const targetIndex = state.scenes.findIndex((scene) => scene.id === row.dataset.sceneRow);
      const source = state.scenes[sourceIndex];
      const target = state.scenes[targetIndex];
      if (source.visual.type === "title" || source.visual.type === "end-card" || target.visual.type === "title" || target.visual.type === "end-card") {
        toast("Title 与 EndCard 是首尾锚点，正文 Scene 不能跨过它们");
      } else {
        pushHistory();
        state.scenes.splice(sourceIndex, 1);
        state.scenes.splice(targetIndex, 0, source);
        const wasPlaying = state.playing;
        if (wasPlaying) state.playing = false;
        toast(wasPlaying
          ? "已暂停播放，并按正在播放的 Scene 与 Scene 内位置复位"
          : "已重排 Scene；选中态与 Player 仍按稳定 Scene 身份定位");
      }
      state.draggedId = null;
      renderApp();
    });
    document.addEventListener("dragend", () => { state.draggedId = null; renderApp(); });

    document.addEventListener("keydown", (event) => {
      const tag = event.target.tagName;
      if (["INPUT", "TEXTAREA", "SELECT"].includes(tag) || event.target.isContentEditable) return;
      if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
        event.preventDefault();
        const keys = ["A", "B", "C"]; const index = keys.indexOf(getVariant());
        setVariant(keys[(index + (event.key === "ArrowRight" ? 1 : 2)) % 3]);
      }
      if (event.key === " ") { event.preventDefault(); state.playing = !state.playing; renderApp(); }
    });

    setInterval(() => {
      if (!state.playing || state.renderProgress !== null) return;
      state.playProgress += .08;
      if (state.playProgress >= 1) {
        const index = state.scenes.findIndex((scene) => scene.id === state.playingSceneId);
        const next = state.scenes[index + 1];
        if (!next) { state.playing = false; state.playProgress = 1; }
        else { state.playingSceneId = next.id; state.playProgress = 0; }
      }
      renderApp();
    }, 360);

    renderApp();
  </script>
</body>
</html>
