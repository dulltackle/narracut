<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Narracut · Scene 编辑原型</title>
<style>
:root{color-scheme:light;font:14px/1.55 system-ui,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;color:#171717;background:#fff;--line:#e7e7e7;--muted:#626262;--blue:#075fc2}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:7px;padding:6px 11px;min-height:34px}button:hover{background:#f3f3f3}button:disabled{color:#777;background:#f6f6f6;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}::selection{background:#d9eaff}textarea{caret-color:var(--blue)}button.primary{background:#202020;color:white;border-color:#202020}button.flat{border-color:transparent;background:transparent}button.flat:hover{background:#eee}header{height:62px;padding:0 26px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}header strong{font-size:16px;font-weight:600}header span{color:var(--muted);margin-left:14px}nav{height:49px;padding:0 26px;display:flex;align-items:center;gap:20px;border-bottom:1px solid var(--line)}nav strong{height:49px;display:grid;align-items:center;border-bottom:2px solid #202020;font-weight:600}nav span{color:var(--muted)}.sample{margin-left:auto;font-size:12px}.toolbar{display:flex;gap:8px;padding:20px 26px 16px;align-items:center;flex-wrap:wrap}.toolbar h1{font-size:20px;font-weight:600;margin:0 12px 0 0}.toolbar .right{margin-left:auto;display:flex;align-items:center;gap:12px}.muted,small{color:var(--muted)}small{font-size:12px}.workspace{max-height:calc(100dvh - 355px);overflow:auto;scrollbar-color:#bbb #f7f7f7;display:grid;grid-template-columns:minmax(0,1fr);margin:0 26px 170px;align-items:start;gap:22px}.workspace.side{grid-template-columns:minmax(0,1fr) 280px}.list{min-width:0;border-top:1px solid var(--line)}.columns,.row{display:grid;grid-template-columns:48px minmax(180px,1fr) 180px 145px;gap:18px;align-items:start}.columns{padding:10px 12px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}.row{padding:16px 12px;border-bottom:1px solid var(--line);position:relative;min-height:112px}.row.selected{background:#f5f5f5}.number{font-variant-numeric:tabular-nums;color:var(--muted);padding:4px 0;min-width:32px}.selected .number{font-weight:700;color:#171717}.narration{width:100%;resize:vertical;background:transparent;border:1px solid transparent;border-radius:5px;min-height:68px;padding:3px 5px;line-height:1.65;font-size:15px}.narration:hover{border-color:#d0d0d0}.narration:focus{background:white}.cell{min-width:0;padding-top:4px}.cell button{margin-top:5px}.assetname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;font-size:13px}.warning{color:#9a4800}.ready{color:#316747}.hint{font-size:12px;color:var(--muted);margin-top:3px;min-height:19px}.side .columns,.side .row{grid-template-columns:40px minmax(180px,1fr) 115px}.side .assetcell{display:none}.side .speechcell{font-size:12px}.panel{border:1px solid var(--line);border-radius:9px;padding:18px;background:#fff;position:sticky;top:15px}.panel h2{font-size:15px;margin:0 0 16px}.panel h3{font-size:13px;font-weight:600;margin:22px 0 10px}.panel p{margin:8px 0;font-size:13px}.assetitem{padding:10px 0;border-bottom:1px solid var(--line)}.assetitem button{padding:3px 7px;font-size:12px;margin-top:7px}.operations{display:flex;gap:5px;flex-wrap:wrap}.expanded .columns,.expanded .row{grid-template-columns:40px minmax(180px,1fr) 180px}.expanded .assetcell{display:none}.expanded .row{min-height:80px}.inline-detail{grid-column:2/-1;display:grid;grid-template-columns:minmax(0,1fr) 1fr;gap:22px;padding-top:14px;border-top:1px solid #ddd}.inline-detail h3{margin:0 0 8px;font-size:13px}.expanded .row:not(.selected) .narration{height:54px;min-height:54px}.expanded .row:not(.selected) .hint{display:none}.switcher{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;box-shadow:0 5px 24px #0002;border-radius:12px;padding:10px 14px;z-index:5;width:min(760px,calc(100% - 32px))}.switchline{display:flex;align-items:center;gap:10px}.switchline button{background:#343434;color:#fff;border-color:#555}.switchline button.active{background:#fff;color:#171717;border-color:#fff}.switchline select{background:#343434;color:white;border:1px solid #666;border-radius:6px;padding:6px;margin-left:auto}.switcher p{margin:8px 0 0;font-size:12px;color:#d7d7d7}.switcher summary{font-size:12px;cursor:pointer;margin-top:7px}.switcher pre{max-height:130px;overflow:auto;font-size:11px;white-space:pre-wrap}dialog{border:1px solid #ddd;border-radius:12px;width:min(510px,90vw);padding:24px}dialog::backdrop{background:#0003}dialog h2{font-size:18px;margin-top:0}dialog footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.picker{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #eee}.picker div{flex:1}.empty{padding:45px 15px;text-align:center}.statusbar{padding:0 26px 12px;font-size:12px;min-height:30px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:1000px){.workspace.side{grid-template-columns:minmax(0,1fr) 240px;gap:14px}.columns,.row{grid-template-columns:35px minmax(160px,1fr) 145px 130px;gap:10px}.workspace{margin-left:16px;margin-right:16px}.side .columns,.side .row{grid-template-columns:30px minmax(120px,1fr) 95px}.toolbar{padding-left:16px;padding-right:16px}}@media(max-width:760px){.workspace.side{grid-template-columns:1fr}.panel{position:static}.columns,.row{grid-template-columns:30px minmax(100px,1fr) 110px}.assetcell{display:none}.sample{display:none}header{padding:0 16px}header span{display:none}.inline-detail{grid-template-columns:1fr}.switchline{flex-wrap:wrap}.switchline select{margin-left:0}.workspace{margin-bottom:210px}.toolbar .right{margin-left:0}.expanded .columns,.expanded .row{grid-template-columns:30px minmax(100px,1fr) 100px}}

/* 用户确认：A 使用紧凑行；不增加连续编辑快捷键。 */
.compact .row{padding:10px 12px;min-height:82px;gap:18px}
.compact .narration{height:54px;min-height:54px;resize:none;overflow:auto}
.compact .hint{display:none}
.compact .row:focus-within .hint,.compact .hint[data-changed="true"]{display:block}
.compact .cell{padding-top:2px}
.compact .speechcell>span{display:block;font-size:12px}
.compact .cell button{font-size:12px;min-height:32px;margin-top:4px}
.compact .columns{position:sticky;top:0;background:#fff;z-index:1}
</style>
<header><div><strong>雨后散步</strong><span>Narracut</span></div><small>Scene 内容编辑原型</small></header><nav><strong>表格工作区</strong><span title="本轮聚焦 Scene 编辑，Agent 审阅将在后续原型讨论">Agent 工作区</span><span class="sample">合成项目 · 不写入真实数据</span></nav>
<div class="toolbar"><h1>脚本</h1><small id="count"></small><div class="right"><button id="add" class="primary">添加 Scene</button><button id="undo" disabled>撤销</button><button id="manage">管理所选 Scene</button></div></div><div class="statusbar" role="status" id="status">所有改动仅保存于本页内存。</div><main class="workspace" id="workspace"></main>
<div class="switcher"><div class="switchline"><button id="prev" aria-label="上一个方案">←</button><button data-variant="A">A 全宽表格</button><button data-variant="B">B 详情侧栏</button><button data-variant="C">C 行内展开</button><button id="next" aria-label="下一个方案">→</button><select id="scenario" aria-label="合成场景"><option value="6">6 个 Scene</option><option value="30">30 个 Scene</option><option value="0">空项目</option></select></div><p id="description"></p><details><summary>原型条件与当前状态</summary><p>2026-09-12 · 浏览器内容视口 <span id="viewport"></span> · 保存、生成和文件状态均为模拟；不代表真实 Codex 外层验收。</p><pre id="state"></pre></details></div><dialog id="dialog"></dialog>
<script>
// 可丢弃原型：比较连续 Narration 编辑时的三种操作组织；URL ?variant=A|B|C；纯内存合成数据。
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const copies=['雨停以后，街道慢慢亮了起来。','巷口的咖啡店刚刚开门。店主推开窗，让烘焙的香气顺着风散到街上。','积水映着经过的人，也映着远处还没散去的云。','我们沿着河边走，不急着到达哪里。','路过旧书店时，我们停下来翻了几页。一本书里夹着的车票，记录着另一段旅程。','有时候，一次散步就足够让平常的一天变得不同。'];
const assets=[{id:'a1',name:'雨后街道.mp4',missing:false},{id:'a2',name:'咖啡店门口.jpg',missing:false},{id:'a3',name:'河边步道.mp4',missing:true},{id:'a4',name:'书店橱窗.jpg',missing:false}];
let scenes=[],selected='',variant=new URLSearchParams(location.search).get('variant')||'A',serial=0,history=[],timer;
const descriptions={A:'全宽表格：文字、Asset 与 Speech 同行扫读；Asset 细节按需打开。',B:'详情侧栏：连续编辑留在列表，所选 Scene 的 Asset 和结构操作常驻右侧；文字列会变窄。',C:'行内展开：普通 Scene 保持紧凑，仅所选 Scene 展开详细操作；切换时列表高度会变化。'};
function reset(n){scenes=Array.from({length:n},(_,i)=>({id:'scene-'+(++serial),text:copies[i%6],assets:i%6===2?[]:[assets[i%4].id],speech:i%4===0?'ready':i%4===1?'missing':i%4===2?'failed':'ready',seconds:(4+i%5)+'.2',reason:''}));selected=scenes[0]?.id||'';history=[];render();}
function snapshot(){history.push(JSON.stringify(scenes));$('#undo').disabled=false}function get(){return scenes.find(s=>s.id===selected)}function tell(t){$('#status').textContent=t}function state(){ $('#state').textContent=JSON.stringify({variant,selected,scenes},null,2);$('#viewport').textContent=innerWidth+' × '+innerHeight+' CSS px';$('#count').textContent=scenes.length+' 个 Scene';$('#undo').disabled=!history.length;}
function speech(s){return s.speech==='ready'?'<span class="ready">已生成 · '+s.seconds+' 秒</span>':s.speech==='generating'?'<span>生成中…</span>':s.speech==='failed'?'<span class="warning">生成失败</span>':'<span class="muted">待生成</span>';}
function speechButton(s){return '<button data-do="speech" data-id="'+s.id+'" '+(!s.text.trim()||s.speech==='generating'?'disabled':'')+'>'+(s.speech==='ready'?'重新生成':s.speech==='failed'?'重试':'生成 Speech')+'</button>';}
function assetSummary(s){if(!s.assets.length)return '<span class="muted">未绑定 Asset</span>';return s.assets.map(id=>{const a=assets.find(a=>a.id===id);return '<span class="assetname '+(a.missing?'warning':'')+'">'+esc(a.name)+(a.missing?' · 文件缺失':'')+'</span>';}).join('');}
function operations(s){return '<div class="operations">'+[['up','上移'],['down','下移'],['duplicate','复制'],['delete','删除']].map(([a,t])=>'<button data-do="'+a+'" data-id="'+s.id+'" '+((a==='up'&&scenes[0]===s)||(a==='down'&&scenes.at(-1)===s)?'disabled':'')+'>'+t+'</button>').join('')+'</div>';}
function assetDetails(s){return s.assets.map(id=>{const a=assets.find(a=>a.id===id);return '<div class="assetitem"><div class="'+(a.missing?'warning':'')+'">'+esc(a.name)+'</div><small>'+(a.missing?'文件缺失；可解除引用或绑定其他 Asset':'已绑定 · 合成文件')+'</small><div><button data-do="unbind" data-id="'+s.id+'" data-asset="'+id+'">解除引用</button></div></div>';}).join('')+'<button data-do="assets" data-id="'+s.id+'">绑定 Asset</button>';}
function row(s,i){return '<section class="row '+(selected===s.id?'selected':'')+'" data-row="'+s.id+'"><button class="number flat" data-do="select" data-id="'+s.id+'" aria-label="选择 Scene '+(i+1)+'" aria-pressed="'+(selected===s.id)+'">'+String(i+1).padStart(2,'0')+'</button><div><label class="sr" for="'+s.id+'">Scene '+(i+1)+' Narration</label><textarea id="'+s.id+'" class="narration" data-edit="'+s.id+'" rows="2">'+esc(s.text)+'</textarea><div class="hint" data-changed="'+Boolean(s.reason)+'" data-hint="'+s.id+'">'+esc(s.reason||'点击文字编辑')+'</div></div><div class="cell assetcell">'+assetSummary(s)+'<button data-do="assets" data-id="'+s.id+'">管理 Asset</button></div><div class="cell speechcell" data-speech="'+s.id+'">'+speech(s)+speechButton(s)+'</div>'+(variant==='C'&&selected===s.id?'<div class="inline-detail"><div><h3>Asset</h3>'+assetDetails(s)+'</div><div><h3>Scene 操作</h3>'+operations(s)+'<p class="hint">修改文字后需要重新生成 Speech。</p></div></div>':'')+'</section>';}
function render(focus){if(!descriptions[variant])variant='A';const w=$('#workspace');w.className='workspace '+(variant==='B'?'side':variant==='C'?'expanded':'compact');w.innerHTML='<div class="list">'+(scenes.length?'<div class="columns"><span>Scene</span><span>Narration</span><span class="assetcell">Asset</span><span>Speech</span></div>'+scenes.map(row).join(''):'<div class="empty"><h2>从第一句 Narration 开始</h2><p class="muted">添加 Scene 后，可绑定 Asset 并生成 Speech。</p><button data-do="add" class="primary">添加 Scene</button></div>')+'</div>'+(variant==='B'&&get()?'<aside class="panel"><h2>Scene '+String(scenes.indexOf(get())+1).padStart(2,'0')+'</h2><small>当前所选 Scene</small><h3>Asset</h3>'+assetDetails(get())+'<h3>Scene 操作</h3>'+operations(get())+'<p class="muted">文字仍在左侧原位编辑。</p></aside>':'');document.querySelectorAll('[data-variant]').forEach(b=>{b.classList.toggle('active',b.dataset.variant===variant);b.setAttribute('aria-pressed',b.dataset.variant===variant)});$('#description').textContent=descriptions[variant];$('#manage').disabled=!scenes.length;state();if(focus){const e=document.getElementById(focus);e?.focus();if(e)fitEditor(e);}}
function fitEditor(e){if(variant==='A'){e.style.height='54px';e.style.height=Math.max(54,e.scrollHeight)+'px';}}
function changeVariant(v){variant=v;const u=new URL(location);u.searchParams.set('variant',v);historyURL(u);render();}function historyURL(u){window.history.replaceState({},'',u)}
function dialog(html){$('#dialog').innerHTML=html;$('#dialog').showModal();}function close(){ $('#dialog').close();}
function action(a,id,asset){const s=scenes.find(s=>s.id===id)||get();if(a==='add'){snapshot();const n={id:'scene-'+(++serial),text:'',assets:[],speech:'missing',seconds:'4.2',reason:''};scenes.splice(s?scenes.indexOf(s)+1:0,0,n);selected=n.id;render(n.id);return;}if(!s)return;if(a==='select'){selected=s.id;render();return;}if(a==='assets'){selected=s.id;render();dialog('<h2>Scene '+(scenes.indexOf(s)+1)+' · 绑定 Asset</h2><p class="muted">从合成登记表选择，绑定顺序按添加顺序保留。</p>'+assets.map(v=>'<div class="picker"><div>'+esc(v.name)+'<br><small class="'+(v.missing?'warning':'')+'">'+(v.missing?'文件缺失':'可用 · 合成文件')+'</small></div><button data-do="'+(s.assets.includes(v.id)?'unbind':'bind')+'" data-id="'+s.id+'" data-asset="'+v.id+'" '+(v.missing&&!s.assets.includes(v.id)?'disabled':'')+'>'+(s.assets.includes(v.id)?'解除引用':'绑定')+'</button></div>').join('')+'<footer><button data-close>完成</button></footer>');return;}if(a==='bind'||a==='unbind'){snapshot();s.assets=a==='bind'?[...s.assets,asset]:s.assets.filter(x=>x!==asset);render();tell('Asset 引用已保存于原型内存。');if($('#dialog').open){close();action('assets',s.id)}return;}if(a==='speech'){if(!s.text.trim())return;snapshot();s.speech='generating';s.reason='正在模拟 Speech 生成';render();const text=s.text;setTimeout(()=>{if(!scenes.includes(s)||s.text!==text||s.speech!=='generating')return;s.speech='ready';s.reason='Speech 已生成（模拟）';render();tell('Scene '+(scenes.indexOf(s)+1)+' Speech 已生成（模拟）。')},1000);return;}if(a==='manage'){dialog('<h2>Scene '+(scenes.indexOf(s)+1)+' 操作</h2>'+operations(s)+'<footer><button data-close>关闭</button></footer>');return;}if(a==='delete'){dialog('<h2>删除这个 Scene？</h2><p>'+esc(s.text||'空 Narration')+'</p><p class="muted">删除后可撤销；项目中的 Asset 文件保留。</p><footer><button data-close autofocus>取消</button><button class="primary" data-do="confirm-delete" data-id="'+s.id+'">删除 Scene</button></footer>');return;}snapshot();if(a==='confirm-delete'){const i=scenes.indexOf(s);scenes.splice(i,1);selected=scenes[Math.min(i,scenes.length-1)]?.id||'';}if(a==='duplicate'){const c={...s,id:'scene-'+(++serial),assets:[...s.assets],speech:'missing',reason:'已复制；Speech 待生成'};scenes.splice(scenes.indexOf(s)+1,0,c);selected=c.id;}if(a==='up'||a==='down'){const i=scenes.indexOf(s),j=i+(a==='up'?-1:1);if(j>=0&&j<scenes.length)[scenes[i],scenes[j]]=[scenes[j],scenes[i]];}close();render();tell('Scene 变更已保存在原型内存，可撤销。');}
document.addEventListener('click',e=>{const b=e.target.closest('[data-do]');if(b)action(b.dataset.do,b.dataset.id,b.dataset.asset);if(e.target.closest('[data-close]'))close();const v=e.target.closest('[data-variant]');if(v)changeVariant(v.dataset.variant)});
document.addEventListener('focusin',e=>{if(!e.target.dataset.edit)return;const id=e.target.dataset.edit;if(selected!==id){selected=id;const pos=e.target.selectionStart;render(id);document.getElementById(id).setSelectionRange(pos,pos)}fitEditor(document.getElementById(id));});
document.addEventListener('input',e=>{const id=e.target.dataset.edit;if(!id)return;const s=scenes.find(s=>s.id===id);if(!e.target.dataset.group){snapshot();e.target.dataset.group='true'}s.text=e.target.value;fitEditor(e.target);s.speech='missing';s.reason='文字已修改；Speech 待生成';document.querySelector('[data-hint="'+id+'"]').textContent=s.reason;document.querySelector('[data-hint="'+id+'"]').dataset.changed='true';document.querySelector('[data-speech="'+id+'"]').innerHTML=speech(s)+speechButton(s);tell('有未保存修改 · 离开文字框后模拟保存');state();});
document.addEventListener('focusout',e=>{if(e.target.dataset.edit&&e.target.dataset.group){delete e.target.dataset.group;tell('已保存于原型内存 · 修改的 Narration 需要重新生成 Speech');}});
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]')||$('#dialog').open)return;if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});
function cycle(d){changeVariant(['A','B','C'][(['A','B','C'].indexOf(variant)+d+3)%3])}$('#prev').onclick=()=>cycle(-1);$('#next').onclick=()=>cycle(1);$('#add').onclick=()=>action('add');$('#manage').onclick=()=>action('manage');$('#undo').onclick=()=>{if(history.length){scenes=JSON.parse(history.pop());if(!get())selected=scenes[0]?.id||'';render();tell('已撤销上一次操作（模拟）。')}};$('#scenario').onchange=e=>{reset(+e.target.value);tell('已重置为新的合成场景。')};window.addEventListener('resize',state);reset(6);
</script></html>
