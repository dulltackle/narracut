<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Narracut 工作台</title>
  <style>
    /*__NARRACUT_MATERIALS__*/
    :root {
      --darkroom:#090d0e;--shell:#101516;--film:#050707;--line:#303738;
      --paper:#f1f3eb;--paper-hover:#e4e8df;--ink:#171b1b;--muted:#909997;
      --blue:#4e88df;--blue-deep:#245da9;--amber:#d89a3d;--green:#67c477;
      --row-h:112px;font-family:"Noto Sans SC","Source Han Sans SC","Microsoft YaHei",sans-serif;
      --paper-texture:none;--film-texture:none;color:#d7dcda;background:var(--darkroom)
    }
    *{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{min-width:320px;background:linear-gradient(180deg,rgba(255,255,255,.035),transparent 18%),var(--darkroom)}
    button,input{font:inherit}button{color:inherit}button:focus-visible,input:focus-visible{outline:2px solid #8ab7f8;outline-offset:3px;box-shadow:0 0 0 5px rgba(78,136,223,.24)}
    ::selection{background:var(--blue);color:white}*{scrollbar-color:#65706f #171c1d;scrollbar-width:thin}*::-webkit-scrollbar{width:10px;height:10px}*::-webkit-scrollbar-track{background:#171c1d}*::-webkit-scrollbar-thumb{background:#65706f;border:2px solid #171c1d}
    .app-shell{height:100dvh;display:grid;grid-template-rows:68px 54px minmax(0,1fr) 102px;border:1px solid #2a3031;background:var(--shell)}
    .project-rail{display:grid;grid-template-columns:minmax(180px,230px) minmax(220px,1fr) minmax(300px,1.6fr) auto;min-width:0;border-bottom:1px solid #2a3031;background:#0b0f10}
    .brand,.folder,.project-id,.connection{display:flex;min-width:0;align-items:center;gap:12px;padding:0 22px;border-right:1px solid #2a3031}
    .brand{color:#f4f5ef;font-family:"Narracut Display",sans-serif;font-size:clamp(1.45rem,2.1vw,2rem);font-stretch:75%;font-variation-settings:"wdth" 75,"wght" 800;font-weight:800;letter-spacing:-.035em}.folder{color:#edf0ed;font-size:1rem;font-weight:650}.project-id{color:#959d9a;font:500 .82rem/1.4 ui-monospace,monospace;overflow:hidden}.project-id strong{color:#cbd1cf;flex:0 0 auto}.project-id span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.connection{border:0;white-space:nowrap;font-size:.9rem}
    .folder-mark{position:relative;width:24px;height:18px;border:2px solid currentColor;border-radius:2px}.folder-mark:before{content:"";position:absolute;width:9px;height:4px;left:1px;top:-6px;border:2px solid currentColor;border-bottom:0;border-radius:2px 2px 0 0}.lamp{width:12px;height:12px;flex:0 0 auto;border-radius:50%;background:var(--green);box-shadow:0 3px 9px rgba(103,196,119,.28)}.lamp[data-status="loading"]{border:2px solid var(--amber);border-radius:2px;background:transparent;box-shadow:none}
    .tabs{display:flex;align-items:stretch;border-bottom:1px solid #2a3031;background:linear-gradient(180deg,#171d1f,#121718)}.tab{min-width:180px;min-height:44px;border:0;border-right:1px solid #303637;border-bottom:3px solid transparent;padding:0 28px;background:transparent;color:#959d9a;cursor:pointer;font-size:.96rem;font-weight:650;text-align:left}.tab[aria-selected="true"]{color:white;border-bottom-color:var(--blue);background:rgba(78,136,223,.08)}
    .inspection-toggle{display:none;align-items:center;min-height:44px;margin:5px 8px 5px auto;padding:0 14px;border:1px solid #465051;border-radius:6px;background:#171d1f;cursor:pointer}
    .workspace{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 320px;overflow:hidden}.stage{min-width:0;min-height:0;padding:14px;background:#111718;overflow:hidden}
    .contact-frame{position:relative;height:100%;min-height:0;display:grid;grid-template-rows:34px minmax(0,1fr) 28px;padding:0 24px;border:1px solid #343b3c;border-radius:9px;background-color:var(--film);background-image:linear-gradient(90deg,rgba(216,154,61,.035),transparent 20%,transparent 80%,rgba(216,154,61,.025)),var(--film-texture);background-size:auto,560px 560px;color:var(--amber);box-shadow:0 26px 70px rgba(0,0,0,.58),inset 0 1px rgba(255,255,255,.045),inset 0 0 0 5px rgba(0,0,0,.18);overflow:hidden}.film-edge{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;color:#c98f37;font:600 .66rem/1 ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 1px 3px #000}.film-edge span:last-child{text-align:right}
    .contact-sheet{position:relative;min-height:0;overflow:hidden;border:1px solid #777c76;background-color:var(--paper);background-image:linear-gradient(rgba(241,243,235,.88),rgba(241,243,235,.88)),var(--paper-texture);background-size:auto,520px 520px;color:var(--ink);box-shadow:0 0 34px rgba(241,243,235,.34),inset 0 0 36px rgba(68,76,72,.14)}.contact-sheet:before,.contact-sheet:after{content:"";position:absolute;z-index:4;width:18px;height:18px;pointer-events:none;border-color:var(--blue-deep);opacity:.8}.contact-sheet:before{top:8px;left:8px;border-top:2px solid;border-left:2px solid}.contact-sheet:after{right:8px;bottom:8px;border-right:2px solid;border-bottom:2px solid}
    .scene-header{height:38px;display:grid;grid-template-columns:80px minmax(240px,1fr) 150px 118px;align-items:center;border-bottom:1px solid #9fa49e;color:#59605e;font:700 .64rem/1 ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase}.scene-header span{padding:0 16px}.scene-scroll{position:absolute;inset:38px 0 0;overflow:auto;overscroll-behavior:contain}.scene-spacer{position:relative;width:100%}.scene-window{position:absolute;inset:0 0 auto 0;will-change:transform}
    .scene-row{position:relative;width:100%;height:var(--row-h);display:grid;grid-template-columns:80px minmax(240px,1fr) 150px 118px;align-items:stretch;padding:0;border:0;border-bottom:1px solid #afb4ae;background:transparent;color:var(--ink);cursor:pointer;text-align:left}.scene-row:hover{background:var(--paper-hover)}.scene-row[aria-pressed="true"]{z-index:1;background:#fafbf5;box-shadow:inset 0 0 0 3px var(--blue)}.scene-row[aria-pressed="true"]:before{content:"";position:absolute;z-index:2;left:5px;top:50%;width:0;height:0;border-top:8px solid transparent;border-bottom:8px solid transparent;border-left:11px solid var(--blue-deep);transform:translateY(-50%)}
    .scene-no,.scene-copy,.scene-assets,.scene-speech{border-right:1px solid #c5c9c2}.scene-no{display:grid;align-content:center;justify-items:center;gap:7px;font-family:"Narracut Display",sans-serif;font-stretch:75%;font-variation-settings:"wdth" 75}.scene-no strong{font-size:1.8rem;font-weight:720;line-height:1}.scene-no small{position:relative;color:var(--blue-deep);font-family:"Narracut Display",sans-serif;font-size:.76rem;font-stretch:82%;font-variation-settings:"wdth" 82,"wght" 700;font-weight:700;line-height:1;letter-spacing:.08em;transform:rotate(-4deg)}.scene-row[aria-pressed="true"] .scene-no small:after{content:"";position:absolute;inset:-5px -9px;border:2px solid var(--blue-deep);border-radius:48% 52% 45% 55%;transform:rotate(7deg)}.scene-copy{min-width:0;display:flex;align-items:center;padding:16px 22px}.scene-copy span{display:-webkit-box;overflow:hidden;color:#171b1b;font-size:clamp(.9rem,1.18vw,1.13rem);font-weight:680;line-height:1.65;-webkit-box-orient:vertical;-webkit-line-clamp:2}
    .scene-assets,.scene-speech{display:flex;flex-direction:column;justify-content:center;gap:7px;padding:12px 16px}.cell-label{color:#626866;font:700 .62rem/1 ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase}.cell-value{color:#202525;font-size:.84rem;font-weight:720}.cell-detail{overflow:hidden;color:#676e6b;font:500 .67rem/1.35 ui-monospace,monospace;text-overflow:ellipsis;white-space:nowrap}.ready{color:var(--blue-deep)}.missing{color:#965d14;text-decoration:underline 1px dashed;text-underline-offset:4px}
    .inspection{min-width:0;min-height:0;padding:22px 20px;overflow:auto;border-left:1px solid var(--line);background:#0d1213}.inspection-close{display:none}.inspection h2,.inspection h3{margin:0;color:#e7ebe8;font-weight:680;letter-spacing:-.02em}.inspection h2{font-size:1.08rem}.inspection h3{font-size:1.08rem;color:var(--blue)}.rule{height:1px;margin:12px 0 18px;background:#353d3e}.checks{display:grid;gap:14px}.check{display:grid;grid-template-columns:12px minmax(0,1fr) auto;align-items:center;gap:10px;color:#b7bfbc;font-size:.82rem}.check-mark{width:9px;height:9px;border-radius:50%;background:var(--green)}.check-state{color:var(--green);font-weight:650}
    .selected{margin-top:26px}.selected-copy{max-height:10.5em;margin:12px 0 18px;overflow:auto;color:#b2bab7;font-size:.79rem;line-height:1.75;white-space:pre-wrap}.facts{display:grid;gap:9px}.fact{display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px;color:#929b98;font:500 .69rem/1.4 ui-monospace,monospace}.fact dd{margin:0;color:#c0c7c5;overflow-wrap:anywhere;text-align:right}.readonly{margin-top:25px;padding-top:18px;border-top:1px solid #353d3e}.readonly strong{display:block;color:var(--amber);font-family:"Narracut Display",sans-serif;font-size:1.25rem;font-stretch:75%;font-variation-settings:"wdth" 75,"wght" 720;font-weight:720;letter-spacing:.03em}.readonly p{margin:8px 0 0;color:#8e9794;font-size:.72rem;line-height:1.6}
    .composer{position:relative;z-index:5;display:grid;grid-template-columns:auto minmax(0,1fr) 78px;align-items:center;gap:16px;padding:14px 16px;border-top:1px solid var(--line);background:#0b1011}.composer-label{color:#b6bebb;font-size:.95rem;font-weight:680}.composer-field{position:relative;min-width:0}.composer input{width:100%;min-height:48px;border:1px solid #3d4647;border-radius:7px;padding:0 18px;background:#171d1f;color:#a7afac;opacity:1;-webkit-text-fill-color:#a7afac}.composer-placeholder{position:absolute;left:18px;top:10px;color:#a7afac;font-size:.8rem;pointer-events:none}.composer-reason{position:absolute;left:18px;top:29px;color:#939c99;font:500 .75rem/1.2 ui-monospace,monospace}.lock{width:54px;height:54px;display:grid;place-items:center;justify-self:end;border:1px solid #333b3c;border-radius:7px;background:#151a1b;color:#69716f}.lock-shape{position:relative;width:18px;height:15px;border:2px solid currentColor;border-radius:2px}.lock-shape:before{content:"";position:absolute;width:10px;height:9px;left:2px;top:-10px;border:2px solid currentColor;border-bottom:0;border-radius:8px 8px 0 0}
    .state-panel,.agent-panel{height:100%;display:grid;place-items:center;padding:34px;border:1px solid #3d4546;border-radius:9px;background:#0d1213}.state-copy,.agent-copy{max-width:620px;text-align:center}.state-copy h1,.agent-copy h1{margin:0;color:#f0f2ed;font-size:clamp(1.55rem,4vw,2.8rem);letter-spacing:-.035em}.state-copy p,.agent-copy p{margin:14px auto 0;color:#aeb6b3;line-height:1.75}.state-code{margin-top:20px;color:var(--amber);font:650 .72rem/1.4 ui-monospace,monospace}.diagnostics{max-height:180px;margin:20px 0 0;padding:0;overflow:auto;list-style:none;text-align:left}.diagnostics li{padding:10px 0;border-top:1px solid #343c3d;color:#c4cbc8;font-size:.78rem;line-height:1.5}.loading{width:min(520px,72vw);display:grid;gap:12px}.loading i{height:12px;background:#273031}.loading i:nth-child(2){width:82%}.loading i:nth-child(3){width:58%}
    @media(max-width:900px){.project-rail{grid-template-columns:180px minmax(180px,1fr) minmax(190px,1fr) auto}.brand,.folder,.project-id,.connection{padding:0 14px}.workspace{grid-template-columns:minmax(0,1fr) 280px}.scene-header,.scene-row{grid-template-columns:70px minmax(220px,1fr) 120px}.scene-speech,.scene-header span:last-child{display:none}}
    @media(max-width:700px){.app-shell{grid-template-rows:92px 50px minmax(0,1fr) 100px}.project-rail{grid-template-columns:104px minmax(0,1fr) auto;grid-template-rows:50px 42px}.brand,.folder,.connection{padding:0 10px}.brand{font-size:1.08rem}.folder{font-size:.8rem}.folder-mark{display:none}.connection{font-size:.7rem;gap:7px}.lamp{width:10px;height:10px}.project-id{grid-column:1/-1;grid-row:2;padding:0 10px;border-top:1px solid #252b2c;border-right:0;font-size:.63rem}.project-id strong{font-size:.58rem}.tab{min-width:0;flex:1;padding:0 8px;font-size:.78rem;text-align:center}.inspection-toggle{display:flex;font-size:.7rem}.workspace{grid-template-columns:minmax(0,1fr)}.stage{padding:8px}.contact-frame{padding:0 10px;grid-template-rows:28px minmax(0,1fr) 22px;border-radius:6px}.film-edge{font-size:.55rem}.scene-header,.scene-row{grid-template-columns:56px minmax(190px,1fr) 96px}.scene-header span{padding:0 10px}.scene-no strong{font-size:1.35rem}.scene-copy{padding:12px}.scene-copy span{font-size:.82rem}.scene-assets{padding:9px}.inspection{position:fixed;z-index:20;top:142px;right:0;bottom:100px;width:min(88vw,360px);display:none;border-left:1px solid #485253;box-shadow:-18px 0 45px rgba(0,0,0,.48)}.inspection[data-open="true"]{display:block}.inspection-close{display:block;float:right;min-width:44px;min-height:44px;margin:-12px -8px 0 8px;border:1px solid #414a4b;border-radius:6px;background:#151b1c;cursor:pointer}.composer{grid-template-columns:minmax(0,1fr) 54px;gap:10px;padding:12px}.composer-label{display:none}.lock{width:48px;height:48px}}
    @media(prefers-reduced-motion:no-preference){.contact-sheet{animation:lightbox .42s cubic-bezier(.16,1,.3,1) both}@keyframes lightbox{from{filter:brightness(.82);box-shadow:0 8px 16px rgba(0,0,0,.32)}to{filter:brightness(1);box-shadow:0 0 22px rgba(241,243,235,.28),inset 0 0 28px rgba(68,76,72,.1)}}}
  </style>
</head>
<body data-surface="narracut-vnext-contact-sheet">
  <!--
    THESIS: Scene 是可扫描的接触印样；拒绝通用 IDE 三栏和缩略图优先。
    OWN-WORLD: 黑色暗房框、背光白表、蓝色校片线、琥珀只读提醒与胶片边码。
    STORY: 用户确认连接与项目身份，检查 Scene 和固定控制文件，再停在诚实的只读边界。
    FIRST VIEWPORT: 项目身份居顶；Scene 接触表占主画面，项目检查在右，禁用 Composer 固定在底。
    FORM: 接触印样灯箱，已确认方向 model-pick，seed narracut-vnext-contact-sheet。
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
  -->
  <div id="app" class="app-shell" aria-live="polite"></div>
  <script>
  (()=>{
    const app=document.getElementById("app"),ROW=112,WINDOW=18;
    const state={result:null,workspace:"table",selected:null,start:0,inspectionOpen:false};
    const esc=value=>String(value??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
    const pad=value=>String(value).padStart(2,"0"),count=value=>new Intl.NumberFormat("en-US").format(value);
    function rail(result){const p=result?.project??{},connected=result?.connection?.status==="connected";return `<header class="project-rail"><div class="brand">Narracut</div><div class="folder"><span class="folder-mark" aria-hidden="true"></span><span>${esc(p.folderName??"等待项目")}</span></div><div class="project-id"><strong>PROJECT ID</strong><span>${esc(p.projectId??"—")}</span></div><div class="connection"><span class="lamp" data-status="${connected?"connected":"loading"}" aria-hidden="true"></span><span>${connected?"连接正常":"连接中"}</span></div></header>`}
    function tabs(){return `<nav class="tabs" role="tablist" aria-label="Narracut 工作区"><button class="tab" type="button" role="tab" data-workspace="table" aria-selected="${state.workspace==="table"}">表格工作区</button><button class="tab" type="button" role="tab" data-workspace="agent" aria-selected="${state.workspace==="agent"}">Agent 工作区</button><button class="inspection-toggle" type="button" data-open-inspection aria-expanded="${state.inspectionOpen}">打开项目检查</button></nav>`}
    function composer(){return `<footer class="composer"><div class="composer-label">Composer</div><div class="composer-field"><input aria-label="Composer" aria-describedby="composer-disabled-reason" type="text" disabled><span class="composer-placeholder">Composer 将在后续功能中启用</span><div class="composer-reason" id="composer-disabled-reason">当前交付只支持只读检查</div></div><div class="lock" aria-hidden="true"><span class="lock-shape"></span></div></footer>`}
    function checks(result){return Object.values(result.checks??{}).map(check=>`<div class="check"><span class="check-mark" aria-hidden="true"></span><span>${esc(check.label)}</span><span class="check-state">有效</span></div>`).join("")}
    function inspector(result){const scenes=result.scenes??[],selected=scenes.find(item=>item.id===state.selected)??scenes[0];return `<aside class="inspection" aria-label="项目检查" data-open="${state.inspectionOpen}"><button type="button" class="inspection-close" data-close-inspection aria-label="关闭项目检查">关闭</button><h2>项目检查</h2><div class="rule"></div><div class="checks">${checks(result)}</div>${selected?`<section class="selected"><div class="rule"></div><h3>Scene ${pad(selected.index)}</h3><p class="selected-copy" data-testid="scene-narration-detail">${esc(selected.narration)}</p><dl class="facts"><div class="fact"><dt>Scene ID</dt><dd>${esc(selected.id)}</dd></div><div class="fact"><dt>Asset</dt><dd>${selected.assets.length}</dd></div><div class="fact"><dt>Speech</dt><dd>${selected.speech.status==="available"?"已生成":"缺失"}</dd></div></dl></section>`:""}<section class="readonly"><strong>只读</strong><p>当前项目只提供检查。Scene、Narration、Asset 和 Speech 不会在这里被修改。</p></section></aside>`}
    function row(item){const selected=item.id===state.selected,asset=item.assets[0],ready=item.speech.status==="available";return `<button type="button" class="scene-row" data-scene-row data-scene-id="${esc(item.id)}" aria-label="Scene ${pad(item.index)}：${esc(item.narration)}" aria-pressed="${selected}"><span class="scene-no"><strong>${pad(item.index)}</strong><small>${pad(item.index)}A</small></span><span class="scene-copy"><span>${esc(item.narration||"空 Narration")}</span></span><span class="scene-assets"><span class="cell-label">Asset</span><span class="cell-value">${asset?`${item.assets.length} Asset`:"无 Asset"}</span><span class="cell-detail">${esc(asset?.path??"未绑定文件")}</span></span><span class="scene-speech"><span class="cell-label">Speech</span><span class="cell-value ${ready?"ready":"missing"}">${ready?"已生成":"缺失"}</span><span class="cell-detail">${ready?`${item.speech.durationMs} ms`:"Draft Duration"}</span></span></button>`}
    function updateWindow(){const win=document.querySelector(".scene-window"),scenes=state.result?.scenes??[];if(!win)return;const start=Math.max(0,Math.min(state.start,Math.max(0,scenes.length-WINDOW)));win.style.transform=`translateY(${start*ROW}px)`;win.innerHTML=scenes.slice(start,start+WINDOW).map(row).join("");bindRows()}
    function table(result){const scenes=result.scenes??[];if(!scenes.length)return `<main class="stage"><section class="state-panel"><div class="state-copy"><h1>项目中还没有 Scene</h1><p>项目有效，可继续只读检查。</p><div class="state-code">0 SCENES · PROJECT VNEXT</div></div></section></main>`;return `<main class="stage"><section class="contact-frame" aria-label="Scene 接触印样"><div class="film-edge"><span>NCUT · ${esc(result.project.projectId.slice(0,13))}</span><span>CONTACT SHEET</span><span>${count(scenes.length)} SCENES</span></div><div class="contact-sheet"><div class="scene-header"><span>Scene</span><span>Narration</span><span>Asset</span><span>Speech</span></div><div class="scene-scroll" tabindex="0" aria-label="Scene 列表"><div class="scene-spacer" style="height:${scenes.length*ROW}px"><div class="scene-window">${scenes.slice(0,WINDOW).map(row).join("")}</div></div></div></div><div class="film-edge"><span>READ ONLY</span><span>${count(scenes.length)} SCENES</span><span>NCUT 01</span></div></section></main>`}
    function agent(result){const selected=(result.scenes??[]).find(item=>item.id===state.selected);return `<main class="stage"><section class="agent-panel"><div class="agent-copy"><h1>Agent 工作区外壳已就位</h1><p>${selected?`Scene ${pad(selected.index)} 保持选中`:"当前项目没有 Scene"}</p><p>Agent 创作任务、候选 Render Program 与 Preview 不在本次只读交付范围内。</p><div class="state-code">READ-ONLY SHELL · COMPOSER DISABLED</div></div></section></main>`}
    function valid(result){return `<div class="workspace">${state.workspace==="table"?table(result):agent(result)}${inspector(result)}</div>`}
    function invalid(result){const error=result.error??{},diagnostics=error.diagnostics??[];return `<div class="workspace"><main class="stage"><section class="state-panel"><div class="state-copy"><h1>项目无法打开</h1><p>${esc(error.message??"项目检查失败，请核对目录与内容后重试。")}</p><div class="state-code">${esc(error.code??"PROJECT_INSPECTION_FAILED")}</div><ul class="diagnostics">${diagnostics.map(item=>`<li><strong>${esc(item.component)}</strong><br><span>${esc(item.message)}</span></li>`).join("")}</ul></div></section></main><aside class="inspection" aria-label="项目检查" data-open="${state.inspectionOpen}"><button type="button" class="inspection-close" data-close-inspection aria-label="关闭项目检查">关闭</button><h2>项目检查</h2><div class="rule"></div><section class="readonly"><strong>只读检查失败</strong><p>错误已同时返回给模型与工作台；Narracut 未修改该目录。</p></section></aside></div>`}
    function loading(){return `<div class="workspace"><main class="stage"><section class="state-panel"><div class="loading" aria-label="正在连接 Narracut"><i></i><i></i><i></i></div></section></main><aside class="inspection" aria-label="项目检查"><h2>项目检查</h2><div class="rule"></div><p>等待工具结果…</p></aside></div>`}
    function render(){const result=state.result;app.innerHTML=`${rail(result)}${tabs()}${result===null?loading():result.status==="valid"?valid(result):invalid(result)}${composer()}`;bind();updateWindow()}
    function select(id){state.selected=id;document.querySelectorAll("[data-scene-id]").forEach(item=>item.setAttribute("aria-pressed",String(item.dataset.sceneId===id)));const aside=document.querySelector(".inspection");if(aside&&state.result?.status==="valid")aside.outerHTML=inspector(state.result);bindInspector()}
    function bindRows(){document.querySelectorAll("[data-scene-id]").forEach(item=>item.addEventListener("click",()=>select(item.dataset.sceneId)))}
    function bindInspector(){document.querySelector("[data-close-inspection]")?.addEventListener("click",()=>{state.inspectionOpen=false;document.querySelector(".inspection")?.setAttribute("data-open","false");document.querySelector("[data-open-inspection]")?.setAttribute("aria-expanded","false")})}
    function bind(){document.querySelectorAll("[data-workspace]").forEach(tab=>tab.addEventListener("click",()=>{state.workspace=tab.dataset.workspace;render()}));document.querySelector("[data-open-inspection]")?.addEventListener("click",()=>{state.inspectionOpen=true;document.querySelector(".inspection")?.setAttribute("data-open","true");document.querySelector("[data-open-inspection]")?.setAttribute("aria-expanded","true")});bindInspector();bindRows();document.querySelector(".scene-scroll")?.addEventListener("scroll",event=>{const next=Math.max(0,Math.floor(event.currentTarget.scrollTop/ROW)-3);if(next!==state.start){state.start=next;updateWindow()}},{passive:true})}
    function accept(result){state.result=result;state.start=0;state.inspectionOpen=false;state.selected=result?.status==="valid"?result.scenes?.[0]?.id??null:null;render()}
    window.addEventListener("message",event=>{if(event.source!==window.parent)return;const message=event.data;if(message?.jsonrpc==="2.0"&&message.method==="ui/notifications/tool-result")accept(message.params?.structuredContent)},{passive:true});
    render();window.parent.postMessage({jsonrpc:"2.0",id:1,method:"ui/initialize",params:{appInfo:{name:"narracut-workbench",version:"0.1.0"},capabilities:{},protocolVersion:"2025-06-18"}},"*");
  })();
  </script>
</body>
</html>
