<body data-surface="narracut-vnext-contact-sheet">
  <!--
    THESIS: Scene 是可扫描的接触印样；拒绝通用 IDE 三栏和缩略图优先。
    OWN-WORLD: 黑色暗房框、背光白表、蓝色校片线、琥珀只读提醒与胶片边码。
    STORY: 用户确认连接与项目身份，检查 Scene，或在 Agent 工作区运行一次不修改项目的专用线程宿主验证。
    FIRST VIEWPORT: 项目身份居顶；表格工作区由接触表主导，Agent 工作区是单任务状态台，禁用 Composer 固定在底。
    FORM: 接触印样灯箱，已确认方向 model-pick，seed narracut-vnext-contact-sheet。
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
  -->
  <div id="app" class="app-shell"></div>
  <div id="agent-status-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="launcher-status-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <script>
  (()=>{
    const app=document.getElementById("app"),ROW=112,WINDOW=18,pending=new Map();let rpcId=10,pollTimer=null,pollFailures=0;
    const state={result:null,workspace:"table",selected:null,start:0,inspectionOpen:false,hostValidation:null,agentBusy:false,agentError:null,focusEmpty:false,launcher:{parentDirectory:"",projectName:"",busy:false,stage:"ready",error:null}};
    const esc=value=>String(value??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
    const pad=value=>String(value).padStart(2,"0"),count=value=>new Intl.NumberFormat("en-US").format(value);
    function rail(result){const p=result?.project??{},connected=result?.connection?.status==="connected";return `<header class="project-rail"><div class="brand">Narracut</div><div class="folder"><span class="folder-mark" aria-hidden="true"></span><span>${esc(p.folderName??"等待项目")}</span></div><div class="project-id"><strong>PROJECT ID</strong><span>${esc(p.projectId??"—")}</span></div><div class="connection"><span class="lamp" data-status="${connected?"connected":"loading"}" aria-hidden="true"></span><span>${connected?"连接正常":"连接中"}</span></div></header>`}
    function launcherRail(){return `<header class="launch-rail"><div class="brand">Narracut</div><div class="launch-title">项目启动台</div><div class="launch-connection"><span class="lamp" aria-hidden="true"></span><span>连接正常</span></div></header>`}
    function validProjectName(){const name=state.launcher.projectName;return name.length>0&&name===name.trim()&&name!=="."&&name!==".."&&!/[\\/\x00-\x1f\x7f]/u.test(name)&&new TextEncoder().encode(name).length<=255}
    function finalProjectPath(){const parent=state.launcher.parentDirectory;if(!parent||!validProjectName())return "";const separator=parent.includes("\\")&&!parent.includes("/")?"\\":"/";return `${parent.replace(/[\\/]+$/u,"")}${separator}${state.launcher.projectName}`}
    function launcherVerdict(){if(!state.launcher.parentDirectory)return {valid:false,copy:"先通过系统窗口选择父目录"};if(!state.launcher.projectName)return {valid:false,copy:"填写新的项目文件夹名"};if(!validProjectName())return {valid:false,copy:"文件夹名不能包含路径分隔符、控制字符或首尾空格"};return {valid:true,copy:"路径可用 · 目标文件夹必须不存在"}}
    function launcherError(){const error=state.launcher.error;if(!error)return "";const residue=error.code==="PROJECT_TEMPORARY_RESIDUE";return `<div class="launch-error" role="status"><strong>${esc(error.code??"PROJECT_OPERATION_FAILED")}</strong><span>${esc(error.message??"项目操作失败，请核对路径后重试。")}</span>${error.path?`<div>${esc(error.path)}</div>`:""}${residue?'<button type="button" class="launch-button residue-action" data-confirm-residue>确认清理并从头重试</button>':""}</div>`}
    function launcher(){const finalPath=finalProjectPath(),verdict=launcherVerdict(),busy=state.launcher.busy;return `<main class="launcher-main"><section class="launch-frame" aria-label="原子发布检查台"><div class="launch-ticket"><section class="launch-step"><div class="step-index" aria-hidden="true">01</div><div class="step-copy"><h2>选择父目录</h2><div class="field-row"><div class="path-field" data-parent-path data-empty="${!state.launcher.parentDirectory}">${esc(state.launcher.parentDirectory||"尚未选择父目录")}</div><button class="launch-button" type="button" data-pick-parent ${busy?"disabled":""}>选择父文件夹</button></div></div></section><section class="launch-step"><div class="step-index" aria-hidden="true">02</div><div class="step-copy"><h2>项目文件夹名</h2><input class="name-field" aria-label="项目文件夹名" value="${esc(state.launcher.projectName)}" placeholder="例如：海边采访" ${busy?"disabled":""}></div></section><section class="launch-step"><div class="step-index" aria-hidden="true">03</div><div class="step-copy"><h2>核对最终项目路径</h2><code class="final-path" data-final-path title="${esc(finalPath)}">${esc(finalPath||"选择位置并填写名称后显示")}</code><p class="path-verdict" data-path-verdict data-valid="${verdict.valid}">${esc(verdict.copy)}</p>${launcherError()}</div></section><section class="launch-step"><div class="step-index" aria-hidden="true">04</div><div class="step-copy"><h2>将创建</h2><div class="create-grid"><ul class="creation-list"><li><span class="file-glyph" aria-hidden="true"></span><span>narracut.json · 严格项目清单</span></li><li><span class="file-glyph" aria-hidden="true"></span><span>project.json · 空 Project DSL</span></li><li><span class="file-glyph" aria-hidden="true"></span><span>零字节 video.md</span></li><li><span class="file-glyph" aria-hidden="true"></span><span>starter 当前 Render Program 修订</span></li><li><span class="file-glyph" aria-hidden="true"></span><span>pnpm-lock.yaml · 精确依赖</span></li></ul><button class="create-action" type="button" data-create-project ${!verdict.valid||busy?"disabled":""}>${busy?"正在原子创建…":"原子创建并打开"}</button></div></div></section></div></section><aside class="launch-side" aria-label="其他入口"><h2>其他入口</h2><div class="side-actions"><section class="side-entry"><span class="side-folder" aria-hidden="true"></span><div><h3>打开项目</h3><p>严格校验已有 Project VNext</p></div><button class="side-button" type="button" data-open-project ${busy?"disabled":""}>选择项目文件夹</button></section><section class="side-entry" data-disabled="true"><span class="side-folder" aria-hidden="true"></span><div><h3>从恢复快照创建</h3><p>此入口将在恢复流程可用后启用</p></div><button class="side-button" type="button" disabled>从恢复快照创建</button></section></div></aside></main>`}
    function launcherFooter(){const busy=state.launcher.busy;return `<footer class="launch-footer"><strong>本地文件系统</strong><span class="footer-rule" aria-hidden="true"></span><span>${busy?`<span class="launch-busy">${state.launcher.stage==="opening"?"正在严格校验并取得租约":"正在写入、复核并原子发布"}</span>`:"准备就绪 · 创建过程不联网、不安装依赖"}</span><span class="footer-status" aria-hidden="true"></span></footer>`}
    function tabs(){return `<nav class="tabs" role="tablist" aria-label="Narracut 工作区"><button class="tab" type="button" role="tab" data-workspace="table" aria-selected="${state.workspace==="table"}">表格工作区</button><button class="tab" type="button" role="tab" data-workspace="agent" aria-selected="${state.workspace==="agent"}">Agent 工作区</button><button class="inspection-toggle" type="button" data-open-inspection aria-expanded="${state.inspectionOpen}">打开项目检查</button></nav>`}
    function composer(){const agent=state.workspace==="agent";return `<footer class="composer"><div class="composer-label">Composer</div><div class="composer-field"><input aria-label="Composer" aria-describedby="composer-disabled-reason" type="text" disabled><span class="composer-placeholder">Composer 将在后续功能中启用</span><div class="composer-reason" id="composer-disabled-reason">${agent?"完整创作指令将在后续功能中启用":"当前交付只支持只读检查"}</div></div><div class="lock" aria-hidden="true"><span class="lock-shape"></span></div></footer>`}
    function checks(result){return Object.values(result.checks??{}).map(check=>`<div class="check"><span class="check-mark" aria-hidden="true"></span><span>${esc(check.label)}</span><span class="check-state">有效</span></div>`).join("")}
    function inspector(result){const scenes=result.scenes??[],selected=scenes.find(item=>item.id===state.selected)??scenes[0];return `<aside class="inspection" aria-label="项目检查" data-open="${state.inspectionOpen}"><button type="button" class="inspection-close" data-close-inspection aria-label="关闭项目检查">关闭</button><h2>项目检查</h2><div class="rule"></div><div class="checks">${checks(result)}</div>${selected?`<section class="selected"><div class="rule"></div><h3>Scene ${pad(selected.index)}</h3><p class="selected-copy" data-testid="scene-narration-detail">${esc(selected.narration)}</p><dl class="facts"><div class="fact"><dt>Scene ID</dt><dd>${esc(selected.id)}</dd></div><div class="fact"><dt>Asset</dt><dd>${selected.assets.length}</dd></div><div class="fact"><dt>Speech</dt><dd>${selected.speech.status==="available"?"已生成":"缺失"}</dd></div></dl></section>`:""}<section class="readonly"><strong>只读</strong><p>当前项目只提供检查。Scene、Narration、Asset 和 Speech 不会在这里被修改。</p></section></aside>`}
    function row(item){const selected=item.id===state.selected,asset=item.assets[0],ready=item.speech.status==="available";return `<button type="button" class="scene-row" data-scene-row data-scene-id="${esc(item.id)}" aria-label="Scene ${pad(item.index)}：${esc(item.narration)}" aria-pressed="${selected}"><span class="scene-no"><strong>${pad(item.index)}</strong><small>${pad(item.index)}A</small></span><span class="scene-copy"><span>${esc(item.narration||"空 Narration")}</span></span><span class="scene-assets"><span class="cell-label">Asset</span><span class="cell-value">${asset?`${item.assets.length} Asset`:"无 Asset"}</span><span class="cell-detail">${esc(asset?.path??"未绑定文件")}</span></span><span class="scene-speech"><span class="cell-label">Speech</span><span class="cell-value ${ready?"ready":"missing"}">${ready?"已生成":"缺失"}</span><span class="cell-detail">${ready?`${item.speech.durationMs} ms`:"Draft Duration"}</span></span></button>`}
    function updateWindow(){const win=document.querySelector(".scene-window"),scenes=state.result?.scenes??[];if(!win)return;const start=Math.max(0,Math.min(state.start,Math.max(0,scenes.length-WINDOW)));win.style.transform=`translateY(${start*ROW}px)`;win.innerHTML=scenes.slice(start,start+WINDOW).map(row).join("");bindRows()}
    function table(result){const scenes=result.scenes??[];if(!scenes.length)return `<main class="stage"><section class="state-panel"><div class="state-copy"><h1 tabindex="-1" data-empty-title>项目中还没有 Scene</h1><p>项目有效，可继续只读检查。</p><div class="state-code">0 SCENES · PROJECT VNEXT</div></div></section></main>`;return `<main class="stage"><section class="contact-frame" aria-label="Scene 接触印样"><div class="film-edge"><span>NCUT · ${esc(result.project.projectId.slice(0,13))}</span><span>CONTACT SHEET</span><span>${count(scenes.length)} SCENES</span></div><div class="contact-sheet"><div class="scene-header"><span>Scene</span><span>Narration</span><span>Asset</span><span>Speech</span></div><div class="scene-scroll" tabindex="0" aria-label="Scene 列表"><div class="scene-spacer" style="height:${scenes.length*ROW}px"><div class="scene-window">${scenes.slice(0,WINDOW).map(row).join("")}</div></div></div></div><div class="film-edge"><span>READ ONLY</span><span>${count(scenes.length)} SCENES</span><span>NCUT 01</span></div></section></main>`}
    function statusCopy(validation){if(!validation)return {label:"未开始",mark:"idle",detail:"等待固定宿主验证任务"};if(validation.status==="running")return {label:"运行中",mark:"running",detail:"正在等待 Codex 返回结构化结果"};if(validation.status==="succeeded")return {label:"验证成功",mark:"succeeded",detail:"临时任务已终结"};const reasons={USER_STOPPED:"用户已停止，可明确继续",CODEX_THREAD_UNAVAILABLE:"原线程已丢失，继续时自动替换",CODEX_INTERRUPTED:"Codex Turn 已中断，可重新继续",CODEX_UNAVAILABLE:"Codex 宿主不可用，可稍后重试"};return {label:"已停止",mark:"stopped",detail:reasons[validation.reason]??"任务已安全停止"}}
    function agent(result){const validation=state.hostValidation,status=statusCopy(validation),connected=validation?.connection?.status==="connected",replaced=validation?.connection?.replaced===true,succeeded=validation?.status==="succeeded",running=validation?.status==="running",stopped=validation?.status==="stopped",taskId=validation?.taskId??"—",threadId=validation?.connection?.threadId??"—",selected=(result.scenes??[]).find(item=>item.id===state.selected),diagnostic=validation?.diagnostic??(state.agentError?{code:"HOST_TOOL_ERROR",message:state.agentError}:null),summary=validation?.result?.summary;return `<main class="stage"><section class="agent-panel" aria-labelledby="agent-validation-title"><header class="agent-head"><div><h1 id="agent-validation-title">Codex 创作线程验证</h1><p>运行一次固定、只读的宿主任务，核对专用线程的创建、状态回传与驱动权边界。验证结果不是候选 Render Program，也不会修改项目内容。</p></div><div class="protocol-tag">APP SERVER · READ ONLY</div></header><div class="agent-main"><section class="task-board" aria-label="临时任务状态"><h2 class="board-title"><span>临时任务状态</span><span>ONE TASK · ONE DRIVER</span></h2><dl class="status-ledger"><div class="status-line"><span class="status-mark" data-status="${status.mark}" aria-hidden="true"></span><dt>任务状态</dt><dd><span>${status.label}</span><span class="replacement-note">${esc(status.detail)}</span></dd></div><div class="status-line"><span class="status-mark" data-status="${connected?"connected":validation?"unavailable":"idle"}" aria-hidden="true"></span><dt>线程连接</dt><dd><span>${connected?"Codex 创作线程已连接":validation?"Codex 创作线程不可用":"等待开始"}</span>${replaced?'<span class="replacement-note">替代线程已接管</span>':""}</dd></div><div class="status-line"><span class="status-mark" data-status="idle" aria-hidden="true"></span><dt>当前 Scene</dt><dd>${selected?`Scene ${pad(selected.index)} 保持选中`:"当前项目没有 Scene"}</dd></div><div class="status-line"><span class="status-mark" data-status="idle" aria-hidden="true"></span><dt>Task ID</dt><dd>${esc(taskId)}</dd></div><div class="status-line"><span class="status-mark" data-status="idle" aria-hidden="true"></span><dt>Thread</dt><dd>${esc(threadId)}</dd></div></dl></section><section class="result-board" aria-label="验证结果"><h2 class="board-title"><span>验证结果</span><span>BOUNDED RESULT</span></h2><div class="result-field" data-status="${succeeded?"succeeded":status.mark}"><h2>${succeeded?"验证成功":running?"正在验证":stopped?"验证已停止":"等待验证"}</h2><p>${succeeded?esc(summary):running?"结果只有通过任务身份、当前驱动身份和项目身份校验后才会进入这里。":stopped?"已保留最小任务检查点；继续时优先恢复原线程，失效则自动创建替代线程。":"开始后，Narracut 将自动创建专用 Codex 创作线程；无需选择 Thread 或输入 Thread ID。"}</p>${succeeded?'<div class="proof-list"><div class="proof-item">任务与当前驱动身份已校验</div><div class="proof-item">项目内容未修改</div></div>':""}</div>${diagnostic?`<div class="agent-diagnostic" role="status"><strong>${esc(diagnostic.code)}</strong>${esc(diagnostic.message)}</div>`:""}</section></div><footer class="agent-actions" aria-label="宿主验证操作"><button class="agent-action" data-agent-action="start" data-kind="primary" type="button" ${state.agentBusy||running||stopped?"disabled":""}>开始验证</button><button class="agent-action" data-agent-action="stop" data-kind="stop" type="button" ${state.agentBusy||!running?"disabled":""}>停止</button><button class="agent-action" data-agent-action="continue" data-kind="primary" type="button" ${state.agentBusy||!stopped?"disabled":""}>继续</button><div class="agent-action-note">不保存对话副本、推理、工具日志或未提交修改</div></footer></section></main>`}
    function valid(result){return `<div class="workspace">${state.workspace==="table"?table(result):agent(result)}${inspector(result)}</div>`}
    function invalid(result){const error=result.error??{},diagnostics=error.diagnostics??[];return `<div class="workspace"><main class="stage"><section class="state-panel"><div class="state-copy"><h1>项目无法打开</h1><p>${esc(error.message??"项目检查失败，请核对目录与内容后重试。")}</p><div class="state-code">${esc(error.code??"PROJECT_INSPECTION_FAILED")}</div><ul class="diagnostics">${diagnostics.map(item=>`<li><strong>${esc(item.component)}</strong><br><span>${esc(item.message)}</span></li>`).join("")}</ul></div></section></main><aside class="inspection" aria-label="项目检查" data-open="${state.inspectionOpen}"><button type="button" class="inspection-close" data-close-inspection aria-label="关闭项目检查">关闭</button><h2>项目检查</h2><div class="rule"></div><section class="readonly"><strong>只读检查失败</strong><p>错误已同时返回给模型与工作台；Narracut 未修改该目录。</p></section></aside></div>`}
    function loading(){return `<div class="workspace"><main class="stage"><section class="state-panel"><div class="loading" aria-label="正在连接 Narracut"><i></i><i></i><i></i></div></section></main><aside class="inspection" aria-label="项目检查"><h2>项目检查</h2><div class="rule"></div><p>等待工具结果…</p></aside></div>`}
    function render(){const result=state.result,isLauncher=result?.status==="launcher";app.className=`app-shell${isLauncher?" launcher-shell":""}`;app.innerHTML=isLauncher?`${launcherRail()}${launcher()}${launcherFooter()}`:`${rail(result)}${tabs()}${result===null?loading():result.status==="valid"?valid(result):invalid(result)}${composer()}`;bind();updateWindow();if(state.focusEmpty){state.focusEmpty=false;requestAnimationFrame(()=>document.querySelector("[data-empty-title]")?.focus())}}
    function select(id){state.selected=id;document.querySelectorAll("[data-scene-id]").forEach(item=>item.setAttribute("aria-pressed",String(item.dataset.sceneId===id)));const aside=document.querySelector(".inspection");if(aside&&state.result?.status==="valid")aside.outerHTML=inspector(state.result);bindInspector()}
    function bindRows(){document.querySelectorAll("[data-scene-id]").forEach(item=>item.addEventListener("click",()=>select(item.dataset.sceneId)))}
    function bindInspector(){document.querySelector("[data-close-inspection]")?.addEventListener("click",()=>{state.inspectionOpen=false;document.querySelector(".inspection")?.setAttribute("data-open","false");document.querySelector("[data-open-inspection]")?.setAttribute("aria-expanded","false")})}
    function request(method,params){const id=rpcId++;return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{if(!pending.delete(id))return;reject(new Error("宿主请求超时，请重试。"))},15000);pending.set(id,{resolve,reject,timer});window.parent.postMessage({jsonrpc:"2.0",id,method,params},"*")})}
    function directoryPath(value){if(typeof value==="string")return value;if(Array.isArray(value))return directoryPath(value[0]);if(value&&typeof value==="object"){for(const key of ["path","directory","absolutePath"]){if(typeof value[key]==="string")return value[key]}}return null}
    async function chooseDirectory(purpose,trigger){const api=window.openai,picker=api?.selectDirectory??api?.pickDirectory??api?.requestDirectoryPicker;if(typeof picker!=="function"){state.launcher.error={code:"HOST_DIRECTORY_PICKER_UNAVAILABLE",message:"当前插件宿主没有提供系统文件夹选择能力；Narracut 不会退化为网页文件浏览器。"};render();document.querySelector(trigger)?.focus();return null}try{const selected=await picker.call(api,{purpose,title:purpose==="create-parent"?"选择新项目的父目录":"选择要打开的 Project VNext",canCreateDirectories:true});const path=directoryPath(selected);if(path===null){document.querySelector(trigger)?.focus();return null}return path}catch(error){state.launcher.error={code:"HOST_DIRECTORY_PICKER_FAILED",message:error?.message??"系统文件夹选择窗口无法打开，请重试。"};render();document.querySelector(trigger)?.focus();return null}}
    async function callHostTool(name,args){if(typeof window.openai?.callTool==="function")return window.openai.callTool(name,args);return request("tools/call",{name,arguments:args})}
    function lifecycleFailure(response,fallback,trigger){const error=response?.structuredContent?.error??{code:"PROJECT_OPERATION_FAILED",message:fallback};state.launcher.busy=false;state.launcher.stage="ready";state.launcher.error=error;render();document.getElementById("launcher-status-announcer").textContent=`${error.code}。${error.message}`;requestAnimationFrame(()=>document.querySelector(error.code==="PROJECT_TEMPORARY_RESIDUE"?"[data-confirm-residue]":trigger)?.focus())}
    async function createFromLauncher(confirmTemporaryCleanup=false){if(state.launcher.busy||!launcherVerdict().valid)return;state.launcher.busy=true;state.launcher.stage="creating";state.launcher.error=null;render();try{const response=await callHostTool("create_project",{projectDirectory:finalProjectPath(),confirmTemporaryCleanup});if(response?.isError||response?.structuredContent?.status==="invalid"){lifecycleFailure(response,"项目创建失败，请核对路径后重试。","[data-create-project]");return}state.focusEmpty=true;accept(response.structuredContent)}catch(error){lifecycleFailure({structuredContent:{error:{code:"PROJECT_CREATE_FAILED",message:error?.message??"项目创建失败，请重试。"}}},"项目创建失败，请重试。","[data-create-project]")} }
    async function openFromLauncher(){if(state.launcher.busy)return;const path=await chooseDirectory("open-project","[data-open-project]");if(path===null)return;state.launcher.busy=true;state.launcher.stage="opening";state.launcher.error=null;render();try{const response=await callHostTool("open_project",{projectDirectory:path});if(response?.isError||response?.structuredContent?.status==="invalid"){lifecycleFailure(response,"项目无法打开，请核对目录后重试。","[data-open-project]");return}state.focusEmpty=response.structuredContent?.project?.sceneCount===0;accept(response.structuredContent)}catch(error){lifecycleFailure({structuredContent:{error:{code:"PROJECT_OPEN_FAILED",message:error?.message??"项目无法打开，请重试。"}}},"项目无法打开，请重试。","[data-open-project]")} }
    async function pickParent(){const path=await chooseDirectory("create-parent","[data-pick-parent]");if(path===null)return;state.launcher.parentDirectory=path;state.launcher.error=null;render();document.querySelector(".name-field")?.focus();document.getElementById("launcher-status-announcer").textContent="父目录已选择，请填写项目文件夹名。"}
    function updateLauncherComputed(){const path=finalProjectPath(),verdict=launcherVerdict(),pathNode=document.querySelector("[data-final-path]"),verdictNode=document.querySelector("[data-path-verdict]"),createButton=document.querySelector("[data-create-project]");if(pathNode){pathNode.textContent=path||"选择位置并填写名称后显示";pathNode.title=path}if(verdictNode){verdictNode.textContent=verdict.copy;verdictNode.dataset.valid=String(verdict.valid)}if(createButton)createButton.disabled=!verdict.valid||state.launcher.busy;document.getElementById("launcher-status-announcer").textContent=verdict.copy}
    function bindLauncher(){document.querySelector("[data-pick-parent]")?.addEventListener("click",pickParent);document.querySelector("[data-open-project]")?.addEventListener("click",openFromLauncher);document.querySelector("[data-create-project]")?.addEventListener("click",()=>createFromLauncher(false));document.querySelector("[data-confirm-residue]")?.addEventListener("click",()=>createFromLauncher(true));document.querySelector(".name-field")?.addEventListener("input",event=>{state.launcher.projectName=event.currentTarget.value;state.launcher.error=null;document.querySelector(".launch-error")?.remove();updateLauncherComputed()})}
    function schedulePoll(delay=250){clearTimeout(pollTimer);if(state.hostValidation?.status!=="running")return;pollTimer=setTimeout(async()=>{try{const response=await request("tools/call",{name:"get_agent_host_validation",arguments:{taskId:state.hostValidation.taskId}});pollFailures=0;applyHostValidation(response?.structuredContent?.hostValidation)}catch(error){const message=error?.message??"无法读取宿主验证状态";if(state.agentError!==message){state.agentError=message;render()}pollFailures=Math.min(pollFailures+1,4);schedulePoll(Math.min(4000,250*(2**pollFailures))) }},delay)}
    function applyHostValidation(validation){if(!validation)return;const changed=JSON.stringify(state.hostValidation)!==JSON.stringify(validation)||state.agentBusy||state.agentError!==null;state.hostValidation=validation;state.agentBusy=false;state.agentError=null;pollFailures=0;if(changed){render();const status=statusCopy(validation);document.getElementById("agent-status-announcer").textContent=`${status.label}。${status.detail}`}schedulePoll()}
    async function runAgentAction(action){if(state.agentBusy||!state.result?.project)return;const names={start:"start_agent_host_validation",stop:"stop_agent_host_validation",continue:"continue_agent_host_validation"},argumentsValue=action==="start"?{projectDirectory:state.result.project.directory}:{taskId:state.hostValidation?.taskId};state.agentBusy=true;state.agentError=null;render();try{const response=await request("tools/call",{name:names[action],arguments:argumentsValue});if(response?.isError)throw new Error(response.structuredContent?.error?.message??"宿主验证操作失败");applyHostValidation(response?.structuredContent?.hostValidation)}catch(error){state.agentBusy=false;state.agentError=error?.message??"宿主验证操作失败";render()}}
    function bind(){if(state.result?.status==="launcher"){bindLauncher();return}document.querySelectorAll("[data-workspace]").forEach(tab=>tab.addEventListener("click",()=>{state.workspace=tab.dataset.workspace;render()}));document.querySelector("[data-open-inspection]")?.addEventListener("click",()=>{state.inspectionOpen=true;document.querySelector(".inspection")?.setAttribute("data-open","true");document.querySelector("[data-open-inspection]")?.setAttribute("aria-expanded","true")});document.querySelectorAll("[data-agent-action]").forEach(button=>button.addEventListener("click",()=>runAgentAction(button.dataset.agentAction)));bindInspector();bindRows();document.querySelector(".scene-scroll")?.addEventListener("scroll",event=>{const next=Math.max(0,Math.floor(event.currentTarget.scrollTop/ROW)-3);if(next!==state.start){state.start=next;updateWindow()}},{passive:true})}
    function accept(result){const previousProjectId=state.result?.project?.projectId;state.result=result;state.start=0;state.inspectionOpen=false;state.launcher.busy=false;state.launcher.stage="ready";state.selected=result?.status==="valid"?result.scenes?.[0]?.id??null:null;if(previousProjectId!==result?.project?.projectId){state.hostValidation=null;state.agentError=null;clearTimeout(pollTimer)}render()}
    window.addEventListener("message",event=>{if(event.source!==window.parent)return;const message=event.data;if(message?.jsonrpc!=="2.0")return;if(message.id!==undefined&&message.method===undefined){const entry=pending.get(message.id);if(!entry)return;clearTimeout(entry.timer);pending.delete(message.id);if(message.error)entry.reject(new Error(message.error.message??"宿主请求失败"));else entry.resolve(message.result);return}if(message.method==="ui/notifications/tool-result"){const content=message.params?.structuredContent;if(content?.hostValidation)applyHostValidation(content.hostValidation);else accept(content)}},{passive:true});
    render();window.parent.postMessage({jsonrpc:"2.0",id:1,method:"ui/initialize",params:{appInfo:{name:"narracut-workbench",version:"0.1.0"},capabilities:{},protocolVersion:"2025-06-18"}},"*");
  })();
  </script>
